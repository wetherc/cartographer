<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UI panels preview</title>
  <!-- The same inline icon index.html uses, so the page logs no favicon 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239d2f21' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2l8.5 5v10L12 22l-8.5-5V7z'/%3E%3Cpath d='M12 8L6 17h12z'/%3E%3Cpath d='M12 2v6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../style.css" />
  <script>
    // Re-apply the saved theme before the first paint, the same as the app
    // does, so the panels preview in the theme the GM last picked. The key
    // and values mirror src/view/Theme.js.
    try {
      const saved = localStorage.getItem('campaign-builder:theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch {
      // A blocked localStorage leaves the OS preference in charge.
    }
  </script>
  <style>
    /* Each panel gets a rail's worth of width. Without one, the sheet's own
       layout collapses and the columns draw over each other. */
    body { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; padding: 1rem; }
    body > section { flex: 0 0 21rem; min-width: 0; }
  </style>
</head>
<body>
  <section id="character-sheet-container"></section>
  <section id="equipment-container"></section>
  <section id="inventory-container"></section>
  <section id="encounter-container"></section>

  <script type="module">
    import { createCharacter, addResource } from '../src/entities/Character.js';
    import { createResource } from '../src/entities/Resource.js';
    import { createCreature } from '../src/entities/Creature.js';
    import { mountCharacterSheet } from '../src/ui/CharacterSheet.js';
    import { mountInventoryPanel } from '../src/ui/InventoryPanel.js';
    import { mountEncounterPanel } from '../src/ui/EncounterPanel.js';
    import { difficultyLine } from '../src/entities/EncounterDifficulty.js';

    let hero = createCharacter('c1', 'Hero', { STR: 14, DEX: 12, CON: 13 });
    hero = addResource(hero, createResource('mana', 'Mana', 'mana', 10));

    mountCharacterSheet(document.getElementById('character-sheet-container'), hero, (next) => {
      hero = next;
    });

    mountInventoryPanel(
      document.getElementById('equipment-container'),
      document.getElementById('inventory-container'),
      hero,
      (next) => {
        hero = next;
      },
    );

    // The panel keeps no list of its own. The two getters supply the rows,
    // and every edit comes back through a callback, so this page holds the
    // encounters the way main.js holds them.
    let encounters = [createCreature('e1', 'Goblin', { disposition: 'hostile', maxHP: 7, level: 1 }), createCreature('e2', 'Wolf', { disposition: 'hostile', maxHP: 11, level: 1 })];

    const encounterPanel = mountEncounterPanel(document.getElementById('encounter-container'), {
      getActiveEncounters: () => encounters.slice(0, 1),
      getNearbyEncounters: () => encounters,
      getDifficulty: () => difficultyLine([hero], encounters.slice(0, 1)),
      onUpdate: (next) => {
        encounters = encounters.map((e) => (e.id === next.id ? next : e));
        encounterPanel.update();
      },
      onDelete: (id) => {
        encounters = encounters.filter((e) => e.id !== id);
        encounterPanel.update();
      },
    });
  </script>
</body>
</html>
