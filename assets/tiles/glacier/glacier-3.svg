<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Crevasse: a thin curved crack with a dark core and a bright lower
         lip. A crevasse field is three cracks in a staggered row. -->
    <g id="cv">
      <path d="M-8 1 Q0 -2.6 8 1 Q0 -0.2 -8 1 Z" fill="#6f9fb3"/>
      <path d="M-6 0.5 Q0 -1.9 6 0.5 Q0 -0.7 -6 0.5 Z" fill="#3f6f85"/>
      <path d="M-7.2 1.6 Q0 -0.8 7.2 1.6" stroke="#f4fafc" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    </g>
    <g id="cg">
      <use href="#cv"/>
      <use href="#cv" transform="translate(2 3.4) scale(0.8)"/>
      <use href="#cv" transform="translate(-1 6.6) scale(0.62)"/>
    </g>
    <!-- Serac: an ice block lit on the west face, shaded on the east face. -->
    <g id="sc">
      <ellipse cx="1" cy="1" rx="6.5" ry="1.7" fill="#a6c8d6"/>
      <polygon points="-5,1 -4.5,-4 -1,-6.5 3.5,-4.5 5,1" fill="#95bccc"/>
      <polygon points="-5,1 -4.5,-4 -1,-6.5 -0.2,1" fill="#e3f1f6"/>
      <polygon points="-4.5,-4 -1,-6.5 3.5,-4.5 -0.4,-3.4" fill="#f7fbfd"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#cfe6ee"/>
  <!-- Edge band: identical across glacier variants. Each tone patch and
       crevasse that crosses an edge is stamped in a wrapped pair
       (a stamp crossing x=0 repeats at +64, likewise y, corners at all
       four), so the ice continues across tile edges with no empty margin. -->
  <ellipse cx="10" cy="-1" rx="9" ry="4" fill="#c6e0ea"/>
  <ellipse cx="10" cy="63" rx="9" ry="4" fill="#c6e0ea"/>
  <ellipse cx="-1" cy="52" rx="7" ry="5" fill="#d8ecf2"/>
  <ellipse cx="63" cy="52" rx="7" ry="5" fill="#d8ecf2"/>
  <use href="#cv" transform="translate(1 18) rotate(-6) scale(0.9)"/>
  <use href="#cv" transform="translate(65 18) rotate(-6) scale(0.9)"/>
  <use href="#cv" transform="translate(-2 50) scale(0.8)"/>
  <use href="#cv" transform="translate(62 50) scale(0.8)"/>
  <use href="#cg" transform="translate(40 -2) rotate(4) scale(0.9)"/>
  <use href="#cg" transform="translate(40 62) rotate(4) scale(0.9)"/>
  <use href="#cv" transform="translate(18 1) rotate(3) scale(0.7)"/>
  <use href="#cv" transform="translate(18 65) rotate(3) scale(0.7)"/>
  <!-- Inset details, placed per variant around the edge band. -->
  <ellipse cx="32" cy="34" rx="13" ry="7" fill="#c2dde8"/>
  <ellipse cx="48" cy="14" rx="8" ry="5" fill="#dceef4"/>
  <ellipse cx="20" cy="54" rx="8" ry="4" fill="#dceef4"/>
  <g fill="none" stroke="#b7d5e1" stroke-width="1" stroke-linecap="round">
    <path d="M12 22 Q22 19 32 22"/>
    <path d="M24 46 Q36 43 48 46"/>
  </g>
  <use href="#cg" transform="translate(28 26) rotate(-4)"/>
  <use href="#cv" transform="translate(46 38) rotate(7) scale(0.75)"/>
  <use href="#cv" transform="translate(50 55) scale(0.85)"/>
  <use href="#cv" transform="translate(16 43) rotate(-10) scale(0.7)"/>
  <use href="#sc" transform="translate(50 24) scale(0.9)"/>
  <use href="#sc" transform="translate(12 30) scale(0.7)"/>
  <g fill="#ffffff">
    <circle cx="36" cy="12" r="0.9"/><circle cx="54" cy="44" r="0.8"/><circle cx="32" cy="56" r="0.7"/>
  </g>
</svg>
