<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A heap of broken masonry and a snapped roof beam, seen from the front
       and above over a transparent ground. A soft contact shadow lies under
       the base of the heap. -->
  <defs>
    <!-- One broken block: a lit top face over a shaded front face. -->
    <g id="blk">
      <path d="M-6 -5 H5 L6.5 -1 H-6 Z" fill="#a39d91"/>
      <path d="M-6 -1 H6.5 L6 4 H-5.5 Z" fill="#77716a"/>
      <path d="M-6 -5 H5 L6.5 -1 L6 4 H-5.5 L-6 -1 Z" fill="none" stroke="#4c4841" stroke-width="0.7"/>
    </g>
  </defs>
  <!-- Contact shadow under the base of the heap. -->
  <g fill="#3d3a34">
    <ellipse cx="32" cy="48.5" rx="25" ry="4" opacity="0.3"/>
    <ellipse cx="32" cy="48.5" rx="22.5" ry="2" opacity="0.35"/>
  </g>
  <!-- The heap of grit and stone chips. -->
  <path d="M10 48 Q14 38 21 34 Q26 24 33 23 Q42 23 46 31 Q53 37 54 47 Q32 52 10 48 Z" fill="#5c574e" stroke="#3a3530" stroke-width="0.8"/>
  <path d="M15 42 Q20 36 24 35 M28 28 Q32 25 37 26 M44 34 Q49 38 50 42" stroke="#77716a" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <!-- Snapped beam across the heap, with a splintered end. -->
  <g transform="translate(33 36) rotate(-20)">
    <path d="M-19 -2 H15 L17 -1 L15.5 0 L18 1 L15 2 H-19 Z" fill="#6a4524" stroke="#3f2a15" stroke-width="0.7"/>
    <path d="M-18.5 -1.2 H14.5" stroke="#9a6d42" stroke-width="0.6"/>
    <rect x="-19" y="-2" width="1.6" height="4" fill="#a57444"/>
  </g>
  <!-- Broken blocks of mixed size and tilt. -->
  <use href="#blk" transform="translate(31 28) rotate(-6) scale(0.8)"/>
  <use href="#blk" transform="translate(20 38) rotate(14) scale(0.75)"/>
  <use href="#blk" transform="translate(44 36) rotate(-14) scale(0.8)"/>
  <use href="#blk" transform="translate(23 45) rotate(-7)"/>
  <use href="#blk" transform="translate(40 45) rotate(9) scale(1.1 1)"/>
  <use href="#blk" transform="translate(32 40) rotate(3) scale(0.7)"/>
  <!-- Loose chips around the base. -->
  <g fill="#8a857a" stroke="#4c4841" stroke-width="0.4">
    <path d="M9 51 l2.4 -1 l1.2 1.6 l-2.2 0.8 Z"/>
    <path d="M52 50.5 l2.6 -0.6 l0.6 1.8 l-2.4 0.4 Z"/>
    <path d="M31 51.5 l2 -0.8 l1 1.3 l-1.8 0.6 Z"/>
    <path d="M47 26.5 l1.8 -0.5 l0.6 1.4 l-1.8 0.4 Z"/>
    <path d="M15 33 l1.6 -0.6 l0.7 1.2 l-1.6 0.5 Z"/>
  </g>
</svg>
