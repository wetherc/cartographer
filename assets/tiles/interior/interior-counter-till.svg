<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The till section of a shop counter seen from the front and above, over a
       transparent ground. The top and the front panel run from edge to
       edge, so a row of sections joins into one long counter. A brass
       scale, a ledger, and a coin box sit on the top. A soft contact shadow
       lies around the footprint. -->
  <!-- Contact shadow around the footprint of the counter. -->
  <g fill="#3d3a34">
    <rect x="0" y="22" width="64" height="31" opacity="0.22"/>
    <rect x="0" y="23" width="64" height="29" opacity="0.3"/>
  </g>
  <!-- Counter top: two planks and a lit front edge. -->
  <rect x="0" y="24" width="64" height="13" fill="#9a6a3c"/>
  <path d="M0 24 H64" stroke="#4a3018" stroke-width="0.9"/>
  <path d="M0 30.4 H64" stroke="#76502b" stroke-width="0.6"/>
  <path d="M0 25 H64" stroke="#b58552" stroke-width="0.8"/>
  <!-- Front panel: an edge face, then panels framed by stiles at each
       end and in the middle. -->
  <rect x="0" y="37" width="64" height="2.5" fill="#6e4a28"/>
  <path d="M0 37 H64 M0 39.5 H64" stroke="#4a3018" stroke-width="0.7"/>
  <rect x="0" y="39.5" width="64" height="11" fill="#7a5230"/>
  <g fill="#6a4524" stroke="#3f2a15" stroke-width="0.6">
    <rect x="4" y="41.5" width="24" height="7"/>
    <rect x="36" y="41.5" width="24" height="7"/>
  </g>
  <path d="M4.6 42.1 H27.4 M36.6 42.1 H59.4" stroke="#9a6d42" stroke-width="0.5"/>
  <rect x="0" y="50.5" width="64" height="2" fill="#5a3a1c"/>
  <path d="M0 50.5 H64 M0 52.5 H64" stroke="#3f2a15" stroke-width="0.6"/>
  <!-- A brass balance scale: a post, a beam, and two pans. -->
  <g>
    <ellipse cx="17" cy="33.4" rx="3" ry="1" fill="#8a6a2a" stroke="#5a4418" stroke-width="0.4"/>
    <rect x="16.4" y="22" width="1.2" height="11.4" fill="#c8a040" stroke="#7a5f1c" stroke-width="0.3"/>
    <path d="M10 23 H24" stroke="#c8a040" stroke-width="1" stroke-linecap="round"/>
    <circle cx="17" cy="22.6" r="0.9" fill="#d8b050"/>
    <path d="M10 23 L8.4 28.4 M10 23 L11.6 28.4 M24 23 L22.4 28.4 M24 23 L25.6 28.4" stroke="#7a5f1c" stroke-width="0.35"/>
    <ellipse cx="10" cy="28.6" rx="2.6" ry="0.9" fill="#d8b050" stroke="#7a5f1c" stroke-width="0.4"/>
    <ellipse cx="24" cy="28.6" rx="2.6" ry="0.9" fill="#d8b050" stroke="#7a5f1c" stroke-width="0.4"/>
    <circle cx="9.4" cy="28.1" r="0.6" fill="#8a8479"/>
    <circle cx="10.6" cy="28.2" r="0.5" fill="#8a8479"/>
  </g>
  <!-- An open ledger with a quill. -->
  <g>
    <path d="M30 27.4 L38 26.6 L38.4 34 L30.4 34.8 Z" fill="#ece4d0" stroke="#a89a78" stroke-width="0.4"/>
    <path d="M38 26.6 L46 27.4 L45.6 34.8 L38.4 34 Z" fill="#e2d8bf" stroke="#a89a78" stroke-width="0.4"/>
    <path d="M31.4 29 H36.6 M31.6 30.6 H36.8 M31.8 32.2 H35.4 M39.6 29 H44.6 M39.6 30.6 H44.4 M39.6 32.2 H43" stroke="#8a7a5a" stroke-width="0.35"/>
    <path d="M44 33.4 L49.6 26.4" stroke="#efe6c8" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M49.6 26.4 L47.2 27.4 M49 27.2 L47.6 28.8" stroke="#d8cfb8" stroke-width="0.5"/>
  </g>
  <!-- A small iron-bound coin box, and a few coins beside it. -->
  <g>
    <rect x="52" y="29" width="7" height="5" fill="#6a4524" stroke="#3f2a15" stroke-width="0.5"/>
    <rect x="52" y="27" width="7" height="2" fill="#7a5230" stroke="#3f2a15" stroke-width="0.5"/>
    <path d="M54 27 V34 M57 27 V34" stroke="#4c4841" stroke-width="0.6"/>
    <rect x="55" y="30.2" width="1.2" height="1.4" fill="#c9a020"/>
    <circle cx="50" cy="35" r="0.9" fill="#d8b050" stroke="#7a5f1c" stroke-width="0.3"/>
    <circle cx="51.8" cy="35.6" r="0.9" fill="#d8b050" stroke="#7a5f1c" stroke-width="0.3"/>
    <circle cx="4" cy="34.6" r="0.9" fill="#b8b2a5" stroke="#6f6a60" stroke-width="0.3"/>
  </g>
</svg>
