<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A closed wooden trapdoor seen from above, set flush in the floor over
       a transparent ground. Its gap lines up with the grout grid of the floor
       pieces, so the leaf covers four floor cells. -->
  <!-- Dark gap around the leaf. -->
  <rect x="15" y="15" width="34" height="34" rx="0.6" fill="#2a241c"/>
  <!-- The leaf: four planks with grain, lit along the north and west edges. -->
  <rect x="16.5" y="16.5" width="31" height="31" fill="#7a5230" stroke="#3f2a15" stroke-width="0.8"/>
  <path d="M24.25 17 V47 M32 17 V47 M39.75 17 V47" stroke="#4e3219" stroke-width="0.8"/>
  <g stroke="#6a4524" stroke-width="0.5" fill="none" stroke-linecap="round">
    <path d="M19.5 26 q1 5 0 10 M28 33 q1 4 0 8 M36 25 q-1 4 0 7 M43.5 35 q1 4 0 8"/>
  </g>
  <path d="M17.2 47 V17.2 H47" stroke="#a57444" stroke-width="0.7" fill="none"/>
  <!-- Iron straps with rivets, and hinge knuckles on the north edge. -->
  <g fill="#4c4841" stroke="#2e2a26" stroke-width="0.5">
    <rect x="16.5" y="20" width="31" height="3"/>
    <rect x="16.5" y="41" width="31" height="3"/>
    <rect x="20" y="14.4" width="6" height="3"/>
    <rect x="38" y="14.4" width="6" height="3"/>
  </g>
  <g fill="#8a857a">
    <circle cx="19" cy="21.5" r="0.6"/><circle cx="28" cy="21.5" r="0.6"/><circle cx="36" cy="21.5" r="0.6"/><circle cx="45" cy="21.5" r="0.6"/>
    <circle cx="19" cy="42.5" r="0.6"/><circle cx="28" cy="42.5" r="0.6"/><circle cx="36" cy="42.5" r="0.6"/><circle cx="45" cy="42.5" r="0.6"/>
  </g>
  <!-- Iron ring pull lying flat on its staple plate. -->
  <rect x="30" y="31" width="4" height="3" fill="#4c4841" stroke="#2e2a26" stroke-width="0.5"/>
  <ellipse cx="32" cy="36.5" rx="3.6" ry="3" fill="none" stroke="#2e2a26" stroke-width="1.8"/>
  <ellipse cx="32" cy="36.5" rx="3.6" ry="3" fill="none" stroke="#8a857a" stroke-width="0.6"/>
</svg>
