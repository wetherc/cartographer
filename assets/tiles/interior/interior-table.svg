<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A feast table with a bench on each side, seen from the front and
       above, over a transparent ground. A soft contact shadow lies around the
       footprint of the table and both benches. -->
  <!-- Contact shadow around the footprint of the table and both benches. -->
  <g fill="#3d3a34">
    <rect x="9.5" y="13" width="45" height="8.5" rx="2.5" opacity="0.22"/>
    <rect x="10.3" y="13" width="43.4" height="7.2" rx="1.5" opacity="0.3"/>
    <rect x="7.5" y="21" width="49" height="25.5" rx="2.5" opacity="0.22"/>
    <rect x="8.3" y="21" width="47.4" height="24.2" rx="1.5" opacity="0.3"/>
    <rect x="9.5" y="44" width="45" height="10.5" rx="2.5" opacity="0.22"/>
    <rect x="10.3" y="44" width="43.4" height="9.2" rx="1.5" opacity="0.3"/>
  </g>
  <!-- Back bench, mostly behind the table. -->
  <rect x="11" y="12" width="42" height="5" rx="0.8" fill="#7a5230" stroke="#3f2a15" stroke-width="0.8"/>
  <rect x="11" y="17" width="42" height="2" fill="#5a3a1c" stroke="#3f2a15" stroke-width="0.6"/>
  <path d="M12 13 H52" stroke="#9a6d42" stroke-width="0.7"/>
  <!-- The dim floor under it between the legs. -->
  <rect x="9.5" y="39" width="45" height="5" fill="#000000" opacity="0.3"/>
  <rect x="11" y="38" width="2.6" height="6" fill="#4a3018"/>
  <rect x="50.4" y="38" width="2.6" height="6" fill="#4a3018"/>
  <!-- Table top: three planks, an edge face, and a linen runner. -->
  <rect x="9" y="20" width="46" height="16" rx="0.8" fill="#9a6a3c" stroke="#4a3018" stroke-width="0.9"/>
  <rect x="9" y="36" width="46" height="2.5" fill="#6e4a28" stroke="#4a3018" stroke-width="0.7"/>
  <path d="M9.5 25.3 H54.5 M9.5 30.7 H54.5" stroke="#76502b" stroke-width="0.6"/>
  <path d="M10 21 H54" stroke="#b58552" stroke-width="0.8"/>
  <rect x="9" y="25" width="46" height="6" fill="#ece4d0"/>
  <rect x="9" y="36" width="46" height="1.2" fill="#d8cfb8"/>
  <path d="M9 26 H55 M9 30 H55" stroke="#a83a3a" stroke-width="0.6"/>
  <path d="M9 25 V37.2 M55 25 V37.2" stroke="#b7ad95" stroke-width="0.6"/>
  <!-- Roast fowl on a pewter platter. -->
  <ellipse cx="32" cy="28" rx="7" ry="3.6" fill="#b8b2a5" stroke="#6f6a60" stroke-width="0.6"/>
  <ellipse cx="32" cy="27.6" rx="4.2" ry="2.5" fill="#a4602a"/>
  <ellipse cx="31.2" cy="26.9" rx="2.4" ry="1.2" fill="#c98446"/>
  <path d="M36 28.6 l2.2 1.2 M28 28.6 l-2.2 1.2" stroke="#a4602a" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="38.6" cy="30" r="0.7" fill="#efe6c8"/><circle cx="25.4" cy="30" r="0.7" fill="#efe6c8"/>
  <!-- Candlestick with a flame and glow. -->
  <circle cx="20" cy="23" r="3.4" fill="#ffd36b" opacity="0.25"/>
  <ellipse cx="20" cy="28" rx="2" ry="0.9" fill="#b8b2a5" stroke="#6f6a60" stroke-width="0.4"/>
  <rect x="19.2" y="23.5" width="1.6" height="4.5" fill="#efe6c8" stroke="#a89a78" stroke-width="0.3"/>
  <path d="M20 20.8 Q21.1 22.6 20 23.7 Q18.9 22.6 20 20.8 Z" fill="#ff9a2e"/>
  <!-- A clay jug, a loaf, apples, and tankards with handles. -->
  <ellipse cx="45" cy="27.5" rx="2.8" ry="2.4" fill="#a8603a" stroke="#5e3218" stroke-width="0.6"/>
  <ellipse cx="45" cy="26.9" rx="1.1" ry="0.8" fill="#3a1e0e"/>
  <path d="M47.6 27 q1.6 0.4 0.4 2" stroke="#5e3218" stroke-width="0.8" fill="none"/>
  <ellipse cx="14.5" cy="33" rx="2.6" ry="1.6" fill="#c08a4a" stroke="#7a5228" stroke-width="0.5"/>
  <path d="M13.3 32.3 l0.6 1.3 M15 32 l0.6 1.3" stroke="#7a5228" stroke-width="0.4"/>
  <circle cx="38" cy="33.5" r="1.3" fill="#b8302c"/><circle cx="40.2" cy="34" r="1.2" fill="#c43a2e"/>
  <circle cx="37.6" cy="33.1" r="0.35" fill="#f0a090"/>
  <g stroke="#4c4841" stroke-width="0.5">
    <path d="M26.6 22.6 q1.9 0.8 0 1.8" fill="none" stroke="#6f6a60" stroke-width="1"/>
    <circle cx="25" cy="23.4" r="2" fill="#8a8479"/>
    <path d="M52.2 32.6 q1.9 0.8 0 1.8" fill="none" stroke="#6f6a60" stroke-width="1"/>
    <circle cx="50.6" cy="33.4" r="2" fill="#8a8479"/>
  </g>
  <circle cx="25" cy="23.4" r="1.3" fill="#efe6c8"/>
  <circle cx="50.6" cy="33.4" r="1.3" fill="#efe6c8"/>
  <!-- Front bench, with its legs on the floor. -->
  <rect x="12.5" y="49" width="2.2" height="3" fill="#4a3018"/>
  <rect x="49.3" y="49" width="2.2" height="3" fill="#4a3018"/>
  <rect x="11" y="43" width="42" height="5" rx="0.8" fill="#7a5230" stroke="#3f2a15" stroke-width="0.8"/>
  <rect x="11" y="48" width="42" height="2" fill="#5a3a1c" stroke="#3f2a15" stroke-width="0.6"/>
  <path d="M12 44 H52" stroke="#9a6d42" stroke-width="0.7"/>
</svg>
