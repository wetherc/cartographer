<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A stone altar on a low dais, seen from above with its front face
       showing. A soft contact shadow lies around the footprint of each part on
       the surface below it. The ground is transparent, because the piece draws over a floor
       tile. -->
  <!-- Contact shadow around the footprint of the dais. -->
  <g fill="#3d3a34">
    <rect x="9.5" y="15" width="45" height="37.5" rx="2.5" opacity="0.22"/>
    <rect x="10.3" y="15" width="43.4" height="36.2" rx="1.5" opacity="0.3"/>
  </g>
  <!-- Dais: a flat top and a short front step. -->
  <rect x="11" y="14" width="42" height="32" fill="#9a9383" stroke="#5c574e" stroke-width="0.8"/>
  <rect x="11" y="46" width="42" height="4" fill="#77716a" stroke="#5c574e" stroke-width="0.8"/>
  <path d="M11.5 15 H52.5" stroke="#b3ac9c" stroke-width="1"/>
  <!-- Altar block: top slab and front face. -->
  <!-- Contact shadow around the footprint of the block on the dais. -->
  <g fill="#3d3a34">
    <rect x="13.5" y="20" width="35" height="24.5" rx="2.5" opacity="0.22"/>
    <rect x="14.3" y="20" width="33.4" height="23.2" rx="1.5" opacity="0.3"/>
  </g>
  <rect x="15" y="19" width="32" height="16" fill="#c4bdae" stroke="#5c574e" stroke-width="0.8"/>
  <rect x="15" y="35" width="32" height="7" fill="#8a8479" stroke="#5c574e" stroke-width="0.8"/>
  <path d="M15.6 20 H46.4 M16 19.6 V34.4" stroke="#dcd6c8" stroke-width="0.9"/>
  <!-- Cloth runner, draped over the front face, with gold trim and fringe. -->
  <rect x="26" y="18.5" width="10" height="25" fill="#7a2e3a"/>
  <path d="M27 18.5 V43.5 M35 18.5 V43.5" stroke="#d4af37" stroke-width="0.9"/>
  <path d="M26 35 H36" stroke="#5a1f29" stroke-width="0.8"/>
  <path d="M27 43.5 v1.6 M29 43.5 v1.6 M31 43.5 v1.6 M33 43.5 v1.6 M35 43.5 v1.6" stroke="#d4af37" stroke-width="0.6"/>
  <!-- Gold chalice on the runner. -->
  <circle cx="31" cy="26.5" r="2.8" fill="#d4af37" stroke="#7a5c14" stroke-width="0.6"/>
  <circle cx="31" cy="26.5" r="1.6" fill="#6b1f2a"/>
  <!-- Two upright candles in holders, each with a flame and a soft glow. -->
  <g>
    <circle cx="20" cy="21.5" r="3.6" fill="#ffd36b" opacity="0.25"/>
    <circle cx="42" cy="21.5" r="3.6" fill="#ffd36b" opacity="0.25"/>
    <ellipse cx="20" cy="30" rx="2.6" ry="1.1" fill="#d4af37" stroke="#7a5c14" stroke-width="0.5"/>
    <ellipse cx="42" cy="30" rx="2.6" ry="1.1" fill="#d4af37" stroke="#7a5c14" stroke-width="0.5"/>
    <rect x="18.9" y="23" width="2.2" height="7" fill="#efe6c8" stroke="#a89a78" stroke-width="0.4"/>
    <rect x="40.9" y="23" width="2.2" height="7" fill="#efe6c8" stroke="#a89a78" stroke-width="0.4"/>
    <path d="M20 19 Q21.3 21.2 20 22.6 Q18.7 21.2 20 19 Z" fill="#ff9a2e"/>
    <path d="M42 19 Q43.3 21.2 42 22.6 Q40.7 21.2 42 19 Z" fill="#ff9a2e"/>
    <circle cx="20" cy="21.7" r="0.5" fill="#fff2b0"/>
    <circle cx="42" cy="21.7" r="0.5" fill="#fff2b0"/>
  </g>
</svg>
