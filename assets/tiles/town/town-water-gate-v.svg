<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A water gate in a north-south run of the town wall, where an east-west
       river goes under the wall. The wall matches town-wall-v at both edges,
       and the river matches river-h at both edges, so the piece joins the
       river tiles at its sides. -->
  <defs>
    <g id="merlon">
      <rect x="0" y="0" width="3.5" height="4.5" fill="#c8c2b6"/>
      <rect x="0" y="4.5" width="3.5" height="1" fill="#8a8478"/>
    </g>
  </defs>
  <!-- The river, straight through the tile, with the banks and water of
       river-h. -->
  <path d="M0 32 H64" stroke="#6b5a3e" stroke-width="22" fill="none"/>
  <path d="M0 32 H64" stroke="#33719f" stroke-width="18" fill="none"/>
  <g stroke="#7fb2d9" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M3 28 C7 27 11 27 15 28"/>
    <path d="M49 36 C53 37 57 37 60 36"/>
  </g>
  <g fill="#8ac2e6"><circle cx="9" cy="35" r="0.9"/><circle cx="54" cy="29" r="1"/></g>
  <!-- Dark mouths of the culvert on the water at each side of the wall,
       deeper on the shaded east side, and ripples where the water leaves. -->
  <rect x="17" y="21" width="6" height="22" fill="#161e23" opacity="0.5"/>
  <rect x="41" y="21" width="6" height="22" fill="#161e23" opacity="0.65"/>
  <g stroke="#7fb2d9" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M49.5 25 Q47.5 32 49.5 39"/>
    <path d="M52.5 27 Q51 32 52.5 37"/>
  </g>
  <!-- Wall, the same as town-wall-v. -->
  <rect x="41" width="3.2" height="21" fill="#000000" opacity="0.18"/>
  <rect x="41" y="43" width="3.2" height="21" fill="#000000" opacity="0.18"/>
  <rect x="23" width="18" height="64" fill="#b0aa9e"/>
  <rect x="37.5" width="3.5" height="64" fill="#9a948a"/>
  <rect x="26.5" width="11" height="64" fill="#c8c2b6"/>
  <path d="M26.5 4 H37.5 M26.5 12 H37.5 M26.5 20 H37.5 M26.5 28 H37.5 M26.5 36 H37.5 M26.5 44 H37.5 M26.5 52 H37.5 M26.5 60 H37.5" stroke="#a39d91" stroke-width="0.5"/>
  <!-- Paving over the vault of the culvert, the full width of the river
       and its banks, framed by the arch stones and crossed by the wide slot
       of the lowered grate. -->
  <rect x="26.5" y="21" width="11" height="22" fill="#b8b1a3"/>
  <path d="M23 21 H41 M23 43 H41" stroke="#5c574e" stroke-width="1.6"/>
  <rect x="29" y="21" width="2.2" height="22" fill="#26221e"/>
  <g fill="#8a8478">
    <rect x="28.4" y="24.5" width="3.4" height="1.2"/><rect x="28.4" y="31.4" width="3.4" height="1.2"/><rect x="28.4" y="38.3" width="3.4" height="1.2"/>
  </g>
  <!-- Grate bars showing in both culvert mouths. -->
  <g fill="#26221e">
    <rect x="21" y="23" width="2" height="1.4"/><rect x="21" y="27" width="2" height="1.4"/><rect x="21" y="31" width="2" height="1.4"/><rect x="21" y="35" width="2" height="1.4"/><rect x="21" y="39" width="2" height="1.4"/>
    <rect x="41" y="23" width="2" height="1.4"/><rect x="41" y="27" width="2" height="1.4"/><rect x="41" y="31" width="2" height="1.4"/><rect x="41" y="35" width="2" height="1.4"/><rect x="41" y="39" width="2" height="1.4"/>
  </g>
  <path d="M26.5 0 V64 M37.5 0 V64" stroke="#7a7468" stroke-width="0.5"/>
  <path d="M23.4 0 V64 M40.6 0 V64" stroke="#5c574e" stroke-width="0.8"/>
  <g>
    <use href="#merlon" transform="translate(23 1)"/>
    <use href="#merlon" transform="translate(23 9)"/>
    <use href="#merlon" transform="translate(23 17)"/>
    <use href="#merlon" transform="translate(23 25)"/>
    <use href="#merlon" transform="translate(23 33)"/>
    <use href="#merlon" transform="translate(23 41)"/>
    <use href="#merlon" transform="translate(23 49)"/>
    <use href="#merlon" transform="translate(23 57)"/>
  </g>
  <g opacity="0.88">
    <use href="#merlon" transform="translate(37.5 1)"/>
    <use href="#merlon" transform="translate(37.5 9)"/>
    <use href="#merlon" transform="translate(37.5 17)"/>
    <use href="#merlon" transform="translate(37.5 25)"/>
    <use href="#merlon" transform="translate(37.5 33)"/>
    <use href="#merlon" transform="translate(37.5 41)"/>
    <use href="#merlon" transform="translate(37.5 49)"/>
    <use href="#merlon" transform="translate(37.5 57)"/>
  </g>
</svg>
