<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Tall mullioned window burned out, origin at its top-left corner. -->
    <g id="win">
      <path d="M0.4 -0.4 Q2.5 -3.6 4.6 -0.4 Z" fill="#3d342c" opacity="0.6"/>
      <rect width="5" height="7" fill="#2e2824" stroke="#c8bea8" stroke-width="0.8"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="10" cy="9" rx="6" ry="3.5" fill="#63a651"/>
  <ellipse cx="55" cy="57" rx="6" ry="3" fill="#529044"/>
  <!-- Scorched yard: browned grass around a sooty dirt patch. -->
  <ellipse cx="32" cy="49" rx="26" ry="11" fill="#7a8a45"/>
  <ellipse cx="32" cy="49" rx="23" ry="9" fill="#8a7a5a"/>
  <ellipse cx="32" cy="50" rx="17" ry="6.5" fill="#6a6050"/>
  <ellipse cx="32" cy="51.5" rx="21" ry="2.4" fill="#3d342c" opacity="0.45"/>
  <!-- Smoke from the gutted hall behind the front. -->
  <g fill="#b8b3a8">
    <circle cx="40" cy="14" r="2" opacity="0.5"/>
    <circle cx="42.5" cy="10" r="2.6" opacity="0.35"/>
    <circle cx="45.5" cy="6.5" r="3" opacity="0.2"/>
  </g>
  <!-- Brick front still standing, the stepped gable broken at the top and
       blackened by soot. -->
  <path d="M15 51.5 V27 H21 V20 H26 V16 L28 14.6 L30.4 17 L33.2 14.2 L35.6 16.4 L38 15.4 V20 H43 V27 H49 V51.5 Z" fill="#9a6448"/>
  <path d="M32 15.4 L33.2 14.2 L35.6 16.4 L38 15.4 V20 H43 V27 H49 V51.5 H32 Z" fill="#88573d"/>
  <path d="M26 16 L28 14.6 L30.4 17 L33.2 14.2 L35.6 16.4 L38 15.4 V24 Q32 21 26 24 Z" fill="#3d342c" opacity="0.45"/>
  <path d="M15 51.5 V27 H21 V20 H26 V16 L28 14.6 L30.4 17 L33.2 14.2 L35.6 16.4 L38 15.4 V20 H43 V27 H49 V51.5" fill="none" stroke="#5a3522" stroke-width="0.7" stroke-linejoin="round"/>
  <g fill="#c8bea8" stroke="#8a8068" stroke-width="0.35">
    <rect x="14.4" y="26.2" width="7.2" height="1.4"/>
    <rect x="20.4" y="19.2" width="6.2" height="1.4"/>
    <rect x="42.4" y="26.2" width="7.2" height="1.4"/>
  </g>
  <!-- Stone string course between the floors. -->
  <rect x="15" y="38.6" width="34" height="1.4" fill="#c8bea8" stroke="#8a8068" stroke-width="0.35"/>
  <!-- Empty windows, with a charred roof beam behind the round gable window. -->
  <circle cx="32" cy="20.5" r="2.8" fill="#2e2824" stroke="#c8bea8" stroke-width="0.8"/>
  <path d="M30 21.8 L34 19.4" stroke="#5a4a36" stroke-width="0.6"/>
  <use href="#win" transform="translate(20.5 29.5)"/>
  <use href="#win" transform="translate(29.5 29.5)"/>
  <use href="#win" transform="translate(38.5 29.5)"/>
  <use href="#win" transform="translate(19 42.5)"/>
  <use href="#win" transform="translate(40 42.5)"/>
  <circle cx="22.2" cy="48" r="0.45" fill="#e8a040"/>
  <!-- Doorway in its stone surround: the doors are gone. -->
  <path d="M27.5 51.5 V45 Q32 39.8 36.5 45 V51.5 Z" fill="#c8bea8" stroke="#8a8068" stroke-width="0.4"/>
  <path d="M28.6 51.5 V45.3 Q32 41.2 35.4 45.3 V51.5 Z" fill="#2e2824"/>
  <path d="M29.8 51.5 L32.2 47.4 L34 51.5 Z" fill="#9a958c"/>
  <rect x="26.5" y="51.5" width="11" height="1.4" fill="#7a7468"/>
  <!-- The iron bracket is bent down, and the guild sign lies on the ground. -->
  <path d="M49 36 L54.4 38.4" stroke="#3a352e" stroke-width="0.7"/>
  <g transform="rotate(-12 54 54)">
    <rect x="51.4" y="52.6" width="5" height="3" rx="0.5" fill="#2a4a6a" stroke="#8a7a3a" stroke-width="0.5"/>
    <circle cx="53.4" cy="54.1" r="0.6" fill="none" stroke="#b8a86a" stroke-width="0.5"/>
    <path d="M54 54.1 H55.4" stroke="#b8a86a" stroke-width="0.5"/>
  </g>
  <!-- Fallen bricks and ash in front of the hall. -->
  <g fill="#9a6448" stroke="#5a3522" stroke-width="0.35">
    <rect x="12" y="53" width="2.4" height="1.2" transform="rotate(12 13.2 53.6)"/>
    <rect x="16" y="55.2" width="2.4" height="1.2" transform="rotate(-18 17.2 55.8)"/>
    <rect x="44.4" y="54.6" width="2.4" height="1.2" transform="rotate(8 45.6 55.2)"/>
  </g>
  <ellipse cx="39" cy="56" rx="3.4" ry="1.2" fill="#9a958c"/>
  <ellipse cx="38.4" cy="55.6" rx="1.7" ry="0.6" fill="#b8b3a8"/>
</svg>
