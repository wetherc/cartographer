<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="53" cy="9" rx="7" ry="4" fill="#63a651"/>
  <ellipse cx="9" cy="30" rx="5" ry="3" fill="#529044"/>
  <!-- Scorched yard: browned grass around a sooty dirt patch. -->
  <ellipse cx="34" cy="40" rx="20" ry="9" fill="#7a8a45"/>
  <ellipse cx="34" cy="41" rx="14" ry="6" fill="#8a7a5a"/>
  <ellipse cx="34" cy="42.6" rx="16" ry="2" fill="#3d342c" opacity="0.45"/>
  <!-- The thatch has burned away. The whitewashed walls stand to a ragged
       line, streaked with soot, and the fieldstone chimney stands whole. -->
  <path d="M21 42.5 V30 L24 31.4 L27.5 29.2 L31 31 L34 29.4 V42.5 Z" fill="#b8ad96"/>
  <path d="M34 42.5 V29.4 L37.5 31.2 L41 29 L44.5 31 L47 30 V42.5 Z" fill="#a89d86"/>
  <path d="M21 42.5 V30 L24 31.4 L27.5 29.2 L31 31 L34 29.4 L37.5 31.2 L41 29 L44.5 31 L47 30 V42.5 Z" fill="none" stroke="#6a5d4a" stroke-width="0.7" stroke-linejoin="round"/>
  <rect x="21" y="41" width="26" height="1.5" fill="#7a7468"/>
  <path d="M24.4 32 Q25.2 34.6 24.8 36 M30 31.6 Q30.8 33 30.4 34.6 M45 31.4 Q44.4 33.6 45 35" stroke="#3d342c" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <rect x="21.5" y="13" width="4.6" height="17" fill="#9a948a" stroke="#6f6a60" stroke-width="0.5"/>
  <path d="M21.5 16 H26.1 M21.5 19.2 H26.1 M21.5 22.4 H26.1 M21.5 25.6 H26.1 M23.8 13 V16 M22.8 16 V19.2 M24.9 19.2 V22.4 M23.4 22.4 V25.6" stroke="#6f6a60" stroke-width="0.4" fill="none"/>
  <rect x="21.1" y="12.4" width="5.4" height="1.2" fill="#3d342c"/>
  <!-- Charred rafters: two still lean on the chimney, and the ridge pole
       has fallen across the room inside. -->
  <g stroke="#2e2824" stroke-linecap="round" fill="none">
    <path d="M26.2 21 L34 16.4 L41.2 22.8" stroke-width="1.2"/>
    <path d="M46 29.4 L42.4 20.6" stroke-width="1.1"/>
    <path d="M29 30.4 L38.4 27.6" stroke-width="1.3"/>
    <path d="M33 29.8 L31.6 24.6" stroke-width="0.9"/>
  </g>
  <!-- Clumps of burned thatch caught on the wall tops. -->
  <g fill="#5a4a32" stroke="#3d342c" stroke-width="0.4">
    <path d="M36.4 31 Q38 29.2 40.2 29.6 Q39.2 31.4 36.4 31 Z"/>
    <path d="M42.8 30.6 Q44.8 29.4 46.4 30.2 Q45 31.6 42.8 30.6 Z"/>
  </g>
  <!-- Thin smoke from the smouldering floor. -->
  <g fill="#b8b3a8">
    <circle cx="37" cy="24" r="1.8" opacity="0.5"/>
    <circle cx="39" cy="20.4" r="2.3" opacity="0.35"/>
    <circle cx="41.6" cy="17" r="2.7" opacity="0.2"/>
  </g>
  <!-- The door is gone, and the windows are dark holes. -->
  <rect x="31" y="34" width="5" height="7" fill="#2e2824"/>
  <path d="M31.6 41 L33.2 38.4 L34.8 41 Z" fill="#9a958c"/>
  <rect x="24" y="35" width="4" height="3.6" fill="#2e2824" stroke="#4a3a2c" stroke-width="0.6"/>
  <rect x="40" y="35" width="4" height="3.6" fill="#2e2824" stroke="#4a3a2c" stroke-width="0.6"/>
  <circle cx="42.8" cy="37.8" r="0.4" fill="#e8a040"/>
  <!-- The woodpile burned to a heap of ash and embers, and the lean-to
       roof lies on it. -->
  <g>
    <ellipse cx="51" cy="41.6" rx="4.6" ry="1.6" fill="#9a958c"/>
    <ellipse cx="50.6" cy="41.2" rx="2.6" ry="0.8" fill="#b8b3a8"/>
    <g fill="#3d342c" stroke="#2e2824" stroke-width="0.35">
      <circle cx="48.6" cy="41.4" r="0.9"/>
      <circle cx="53.4" cy="41.6" r="0.9"/>
    </g>
    <circle cx="51.4" cy="40.8" r="0.4" fill="#e8a040"/>
    <path d="M47 39.4 L56.2 40.8 L55.8 42 L47.2 40.6 Z" fill="#4a3c2c" stroke="#2e2824" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
  <!-- Kitchen garden trampled flat, the fence knocked down, and the gate
       gap left open. -->
  <g>
    <rect x="9" y="46" width="22" height="10" rx="1" fill="#6a6050"/>
    <path d="M11 49.5 H29 M11 53.5 H29" stroke="#4a4236" stroke-width="1.2"/>
    <g fill="#6a7a3a">
      <circle cx="13" cy="49" r="1"/>
      <circle cx="22" cy="49" r="0.9"/>
    </g>
    <g stroke="#4a4236" stroke-width="0.8" fill="none" stroke-linecap="round">
      <path d="M17 48.6 l1.6 0.8 M25.6 48.8 l1.4 0.4 M13.6 53.4 l1.6 -0.4 M21.4 53.6 l1.2 -0.8"/>
    </g>
  </g>
  <path d="M9 46 H22 M9 46 V56 M31 46 V51" stroke="#6a5d4a" stroke-width="0.8" fill="none"/>
  <g fill="#b8ad96" stroke="#6a5d4a" stroke-width="0.35">
    <path d="M8.4 58.5 V55 L9.2 54.2 L10 55 V58.5 Z"/>
    <path d="M11.4 58.5 V55 L12.2 54.2 L13 55 V58.5 Z"/>
    <path d="M14.2 58.6 L16.6 56.4 L17.4 57 L15 59.2 Z"/>
    <path d="M26.4 58.5 V55 L27.2 54.2 L28 55 V58.5 Z"/>
    <path d="M29.4 58.5 V55 L30.2 54.2 L31 55 V58.5 Z"/>
  </g>
  <path d="M8.4 56 H13 M8.4 57.6 H13 M26.4 56 H31 M26.4 57.6 H31" stroke="#8a8272" stroke-width="0.6"/>
  <path d="M18.6 58.8 L24.4 57.6" stroke="#8a8272" stroke-width="0.6"/>
  <!-- Stepping stones from the door, dusted with ash. -->
  <g fill="#8a857c" stroke="#6a655c" stroke-width="0.4">
    <ellipse cx="33.8" cy="45.5" rx="1.8" ry="0.9"/>
    <ellipse cx="34.8" cy="48.6" rx="1.7" ry="0.85"/>
    <ellipse cx="34" cy="51.8" rx="1.6" ry="0.8"/>
  </g>
  <!-- The apple tree burned bare: a charred trunk and forked branches. -->
  <g>
    <ellipse cx="47" cy="55.5" rx="5" ry="1.8" fill="#3d342c" opacity="0.45"/>
    <path d="M46.2 55.5 L46.4 49.5 L47.8 49.5 L47.8 55.5 Z" fill="#2e2824"/>
    <g stroke="#2e2824" stroke-linecap="round" fill="none">
      <path d="M47 50 L44 46.4 L43 44 M44 46.4 L45.6 43.4" stroke-width="0.9"/>
      <path d="M47.2 50 L50 46 L51.4 44.6 M50 46 L49.4 43.4" stroke-width="0.9"/>
      <path d="M47 49.6 V44.2" stroke-width="0.8"/>
    </g>
  </g>
</svg>
