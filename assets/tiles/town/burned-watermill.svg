<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One charred float, stamped round the wheel where a float is left. -->
    <rect id="float" x="-0.6" y="-9.8" width="1.2" height="3.6" fill="#4a3c2c" stroke="#2e2824" stroke-width="0.35"/>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="10" cy="10" rx="6" ry="3.5" fill="#63a651"/>
  <ellipse cx="10" cy="59.5" rx="5" ry="2.2" fill="#529044"/>
  <!-- Scorched yard: browned grass around a sooty dirt patch. -->
  <ellipse cx="22" cy="47" rx="14" ry="8" fill="#7a8a45"/>
  <ellipse cx="20" cy="48" rx="9" ry="5" fill="#8a7a5a"/>
  <!-- The mill race still runs: the millpond, the sluice, the leat, and the
       tail pool. The sluice gate is gone, and only its posts stand. -->
  <ellipse cx="54.5" cy="11.5" rx="8" ry="5.6" fill="#6b5a3e"/>
  <ellipse cx="54.5" cy="11.5" rx="6.8" ry="4.4" fill="#33719f"/>
  <ellipse cx="25.5" cy="56" rx="7" ry="5.2" fill="#6b5a3e"/>
  <ellipse cx="25.5" cy="56" rx="6" ry="4.2" fill="#33719f"/>
  <path d="M52 14 V50 A3.5 3.5 0 0 1 48.5 53.5 H30 V58.5 H48.5 A8.5 8.5 0 0 0 57 50 V14 Z" fill="#33719f"/>
  <g fill="none" stroke-width="1.6">
    <path d="M52 16.8 V50 A3.5 3.5 0 0 1 48.5 53.5 H31.6 M57 16.8 V50 A8.5 8.5 0 0 1 48.5 58.5 H31.6" stroke="#a39d91"/>
    <path d="M52 16.8 V50 A3.5 3.5 0 0 1 48.5 53.5 H31.6 M57 16.8 V50 A8.5 8.5 0 0 1 48.5 58.5 H31.6" stroke="#6f6a60" stroke-dasharray="0.35 2.65"/>
  </g>
  <g fill="#3d342c" stroke="#2e2824" stroke-width="0.35">
    <rect x="50.6" y="19.2" width="1.4" height="3.2"/>
    <rect x="57" y="19.2" width="1.4" height="3.2"/>
  </g>
  <g stroke="#7fb2d9" stroke-width="0.9" fill="none" stroke-linecap="round">
    <path d="M51 10.5 Q54.5 9.3 58 10.5"/>
    <path d="M54.5 22 V34"/>
    <path d="M22 55 Q25 54 28 55"/>
  </g>
  <!-- Ash and a charred plank floating on the tail pool. -->
  <path d="M21 57.2 L26.6 56.2" stroke="#3d342c" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="28.2" cy="57.8" rx="1.4" ry="0.5" fill="#9a958c"/>
  <!-- The stone lower storey stands, blackened above the openings. -->
  <rect x="10" y="40" width="34" height="12" fill="#a39b88"/>
  <path d="M10 44 H44 M10 48 H44 M15 40 V44 M23 40 V44 M31 40 V44 M39 40 V44 M11 44 V48 M19 44 V48 M27 44 V48 M35 44 V48 M43 44 V48 M15 48 V52 M23 48 V52 M31 48 V52 M39 48 V52" stroke="#756d5c" stroke-width="0.4"/>
  <path d="M10 40 H44 V42.4 Q38 44 32 42 Q24 44.6 18 42.2 Q13 43.6 10 42.6 Z" fill="#2e2824" opacity="0.55"/>
  <!-- The timber upper storey burned down to stumps of its posts and one
       charred brace. -->
  <g fill="#2e2824">
    <rect x="10" y="35" width="1.4" height="5"/>
    <rect x="18.1" y="32.4" width="1.4" height="7.6"/>
    <rect x="26.3" y="36.6" width="1.4" height="3.4"/>
    <rect x="34.5" y="33.6" width="1.4" height="6.4"/>
    <rect x="42.6" y="36" width="1.4" height="4"/>
  </g>
  <path d="M43.3 40 L37.6 34.6" stroke="#2e2824" stroke-width="0.9" stroke-linecap="round"/>
  <path d="M10 40 H44" stroke="#2e2824" stroke-width="1.2"/>
  <!-- The roof has fallen in. A ridge beam leans on a post, and a scrap of
       shingles lies on the stone. -->
  <path d="M12 30.6 L19 29 L35.2 33.4" stroke="#2e2824" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M28 39.6 L31 36.8 L36.6 37.4 L39.6 39.6 Z" fill="#5a3a26" stroke="#2e2824" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Smoke from the rubble on the mill floor. -->
  <g fill="#b8b3a8">
    <circle cx="24" cy="32" r="2.2" opacity="0.5"/>
    <circle cx="22" cy="27.4" r="2.8" opacity="0.35"/>
    <circle cx="19" cy="23" r="3.3" opacity="0.2"/>
  </g>
  <!-- The arched door has burned out, and an ember glows in the hole. -->
  <path d="M11.5 52 V46 Q14.5 43 17.5 46 V52 Z" fill="#1f1a16" stroke="#4a3a2c" stroke-width="0.5"/>
  <circle cx="14.2" cy="50.6" r="0.45" fill="#e8a040"/>
  <rect x="10.8" y="52" width="7.4" height="1.2" fill="#7a7468"/>
  <!-- The wheel is broken: the upper rim burned away, two spokes gone, and
       most floats lost. It no longer turns in the leat. -->
  <g transform="translate(37 46)">
    <path d="M-8.2 0 A8.2 8.2 0 0 0 7.1 4.1" fill="none" stroke="#4a3c2c" stroke-width="1.4"/>
    <path d="M-5.6 0 A5.6 5.6 0 0 0 4.8 2.8" fill="none" stroke="#5a4636" stroke-width="0.7"/>
    <path d="M-8.2 0 H4 M0 0 V8.2 M-5.8 5.8 L0 0 M0 0 L5.8 5.8 M-4 -4 L0 0" stroke="#3d342c" stroke-width="0.9"/>
    <use href="#float" transform="rotate(150)"/>
    <use href="#float" transform="rotate(180)"/>
    <use href="#float" transform="rotate(240)"/>
    <use href="#float" transform="rotate(270)"/>
    <circle r="1.7" fill="#2e2824"/>
  </g>
  <!-- Broken floats and a spoke on the grass by the tail pool. -->
  <g fill="#4a3c2c" stroke="#2e2824" stroke-width="0.35">
    <rect x="13.4" y="57.4" width="3.6" height="1.2" transform="rotate(-20 15 58)"/>
    <rect x="4.6" y="55.8" width="1.2" height="3.6" transform="rotate(60 5.2 57.6)"/>
  </g>
  <path d="M8.4 59.6 L12.6 60.4" stroke="#3d342c" stroke-width="0.9" stroke-linecap="round"/>
  <!-- The water runs still and dark past the broken wheel. -->
  <rect x="30.5" y="55.1" width="17" height="2.6" fill="#33719f" opacity="0.85"/>
  <path d="M31 56.4 Q34 55.8 37 56.4" stroke="#7fb2d9" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <!-- Grain sacks on the yard, one burned open. -->
  <g>
    <ellipse cx="6.6" cy="49.6" rx="2.8" ry="0.7" fill="#3d342c" opacity="0.45"/>
    <path d="M3.8 49.5 Q3.3 46.3 5.1 45.5 L5.6 45 H6.8 L7.3 45.5 Q9.1 46.3 8.6 49.5 Z" fill="#8a8272" stroke="#6a5d4a" stroke-width="0.45"/>
    <path d="M5.4 45 H7" stroke="#4a4236" stroke-width="0.6"/>
    <path d="M6 53.8 L6.6 51.4 L8.8 50.8 L10.8 52.2 L10.4 53.8 Z" fill="#3d342c" stroke="#2e2824" stroke-width="0.45"/>
    <ellipse cx="12.4" cy="54" rx="2" ry="0.6" fill="#c8bb9a"/>
  </g>
</svg>
