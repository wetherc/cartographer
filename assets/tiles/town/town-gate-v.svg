<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A gate in a north-south run of the town wall, where an east-west street
       goes through. The wall matches town-wall-v at both edges, and the street
       matches road-h at both edges, so the piece works with or without a road
       overlay under it. -->
  <defs>
    <g id="merlon">
      <rect x="0" y="0" width="3.5" height="4.5" fill="#c8c2b6"/>
      <rect x="0" y="4.5" width="3.5" height="1" fill="#8a8478"/>
    </g>
    <!-- One gate tower seen from above: a parapet round a flat roof, merlons
         on the parapet, and the south face below it. -->
    <g id="tower">
      <rect x="0" y="0" width="24" height="12" fill="#b0aa9e" stroke="#5c574e" stroke-width="0.8"/>
      <rect x="2.4" y="2.4" width="19.2" height="7.2" fill="#a39d91" stroke="#7a7468" stroke-width="0.5"/>
      <g fill="#c8c2b6">
        <rect x="0.4" y="0.4" width="3" height="2"/><rect x="7.2" y="0.4" width="3" height="2"/>
        <rect x="13.8" y="0.4" width="3" height="2"/><rect x="20.6" y="0.4" width="3" height="2"/>
        <rect x="0.4" y="9.6" width="3" height="2"/><rect x="7.2" y="9.6" width="3" height="2"/>
        <rect x="13.8" y="9.6" width="3" height="2"/><rect x="20.6" y="9.6" width="3" height="2"/>
        <rect x="0.4" y="5" width="2" height="2"/><rect x="21.6" y="5" width="2" height="2"/>
      </g>
      <rect x="0" y="12" width="24" height="4" fill="#9a948a" stroke="#5c574e" stroke-width="0.8"/>
      <rect x="11.5" y="12.8" width="1" height="2.6" rx="0.5" fill="#3a3630"/>
    </g>
    <g id="pennant">
      <path d="M0 0 V-8" stroke="#5a4530" stroke-width="0.8"/>
      <path d="M0 -8 L5.5 -6.6 L0 -5.2 Z" fill="#b03a2e"/>
    </g>
  </defs>
  <!-- The street, the same as road-h. -->
  <path d="M0 32 L64 32" stroke="#7c6448" stroke-width="20" fill="none"/>
  <path d="M0 32 L64 32" stroke="#bb9c70" stroke-width="16" fill="none"/>
  <g stroke="#9c8158" stroke-width="1.5" fill="none"><path d="M0 27 L64 27"/><path d="M0 37 L64 37"/></g>
  <!-- Dark mouths of the gate passage on the road at each side of the wall,
       deeper on the shaded east side. -->
  <rect x="19" y="24" width="4" height="16" fill="#2e2a25" opacity="0.4"/>
  <rect x="41" y="24" width="4" height="16" fill="#2e2a25" opacity="0.55"/>
  <!-- Wall, the same as town-wall-v. -->
  <rect x="41" width="3.2" height="64" fill="#000000" opacity="0.18"/>
  <rect x="23" width="18" height="64" fill="#b0aa9e"/>
  <rect x="37.5" width="3.5" height="64" fill="#9a948a"/>
  <rect x="26.5" width="11" height="64" fill="#c8c2b6"/>
  <path d="M26.5 4 H37.5 M26.5 12 H37.5 M26.5 20 H37.5 M26.5 28 H37.5 M26.5 36 H37.5 M26.5 44 H37.5 M26.5 52 H37.5 M26.5 60 H37.5" stroke="#a39d91" stroke-width="0.5"/>
  <!-- Paving over the vault of the passage, crossed by the portcullis slot. -->
  <rect x="26.5" y="24" width="11" height="16" fill="#b8b1a3"/>
  <rect x="29.4" y="24" width="1.2" height="16" fill="#3a3630"/>
  <path d="M26.5 0 V64 M37.5 0 V64" stroke="#7a7468" stroke-width="0.5"/>
  <path d="M23.4 0 V64 M40.6 0 V64" stroke="#5c574e" stroke-width="0.8"/>
  <g>
    <use href="#merlon" transform="translate(23 1)"/>
    <use href="#merlon" transform="translate(23 25)"/>
    <use href="#merlon" transform="translate(23 33)"/>
    <use href="#merlon" transform="translate(23 57)"/>
  </g>
  <g opacity="0.88">
    <use href="#merlon" transform="translate(37.5 1)"/>
    <use href="#merlon" transform="translate(37.5 25)"/>
    <use href="#merlon" transform="translate(37.5 33)"/>
    <use href="#merlon" transform="translate(37.5 57)"/>
  </g>
  <!-- Flanking towers north and south of the street, with their shadows. -->
  <rect x="44" y="8" width="3.2" height="16" fill="#000000" opacity="0.18"/>
  <rect x="44" y="42" width="3.2" height="16" fill="#000000" opacity="0.18"/>
  <use href="#tower" transform="translate(20 8)"/>
  <use href="#tower" transform="translate(20 42)"/>
  <use href="#pennant" transform="translate(32 13)"/>
  <use href="#pennant" transform="translate(32 47)"/>
</svg>
