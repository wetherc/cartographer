<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Stall with a Dutch door, the top leaf open and a horse looking out.
         The origin is the top-left corner of the opening. The horse coat
         takes the fill of the <use>. -->
    <g id="stall">
      <rect width="8" height="13" fill="#2e2216"/>
      <path d="M2.8 7.6 Q2 4.6 3.2 2.6 L3 0.6 L4 1.8 L5 0.6 L5 2.6 Q6.2 4.6 5.4 7.6 Z"/>
      <path d="M3.2 7.6 Q3.2 9.4 4.1 9.4 Q5 9.4 5 7.6 Z" fill="#3a2a19" opacity="0.7"/>
      <path d="M4.1 2.8 V5.4" stroke="#f3ecd8" stroke-width="0.7" stroke-linecap="round"/>
      <circle cx="3.2" cy="4" r="0.35" fill="#1a130c"/>
      <circle cx="5" cy="4" r="0.35" fill="#1a130c"/>
      <rect y="7.4" width="8" height="5.6" fill="#a07c50" stroke="#5a4028" stroke-width="0.5"/>
      <path d="M0.3 7.8 L7.7 12.6 M0 10.2 H8" stroke="#6f5433" stroke-width="0.6"/>
      <rect x="-0.6" y="-0.6" width="9.2" height="0.9" fill="#5a4028"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="10" cy="9" rx="6" ry="3.5" fill="#63a651"/>
  <ellipse cx="56" cy="11" rx="5" ry="3" fill="#529044"/>
  <ellipse cx="30" cy="45" rx="27" ry="11" fill="#c2a36c"/>
  <ellipse cx="30" cy="46" rx="21" ry="7.5" fill="#cdb078"/>
  <ellipse cx="28" cy="46.8" rx="23" ry="2.2" fill="#8a7447" opacity="0.45"/>
  <!-- Long, low timber stable, the east end in shade. -->
  <rect x="6" y="28" width="42" height="18.5" fill="#b08a5c"/>
  <rect x="30" y="28" width="18" height="18.5" fill="#9c7a50"/>
  <path d="M6 34 H48 M6 40 H48" stroke="#7a5a3a" stroke-width="0.4"/>
  <rect x="6" y="28" width="42" height="18.5" fill="none" stroke="#5a4028" stroke-width="0.7"/>
  <rect x="6" y="45" width="42" height="1.5" fill="#8a7a62"/>
  <!-- Shingle roof with a hay loft hatch. -->
  <path d="M3 30 L9 17 H45 L51 30 Z" fill="#6b4a32"/>
  <path d="M27 17 H45 L51 30 H27 Z" fill="#5c3f2a"/>
  <path d="M7.2 21.5 H46.8 M5.1 26 H48.9" stroke="#4c3322" stroke-width="0.6"/>
  <path d="M9 17 H45" stroke="#3a2718" stroke-width="1.2"/>
  <path d="M3 30 H51" stroke="#3a2718" stroke-width="1"/>
  <rect x="6" y="30.5" width="42" height="1.2" fill="#3a2a19" opacity="0.35"/>
  <path d="M24 26 V20.6 L27 18.6 L30 20.6 V26 Z" fill="#b08a5c" stroke="#5a4028" stroke-width="0.5"/>
  <rect x="25.2" y="21.3" width="3.6" height="4.7" fill="#2e2216"/>
  <path d="M25.4 26 Q26 23.8 27 24.6 Q28 23.6 28.6 26 Z" fill="#e3c86a"/>
  <!-- Three stalls: a bay, a white, and a black horse. -->
  <use href="#stall" transform="translate(10 33)" fill="#8a5a32"/>
  <use href="#stall" transform="translate(23 33)" fill="#e6e0d2"/>
  <use href="#stall" transform="translate(36 33)" fill="#3a302a"/>
  <!-- Hay bales and a pitchfork at the east end. -->
  <g>
    <rect x="50" y="41" width="8" height="5" rx="0.6" fill="#d9b85a" stroke="#a88a3a" stroke-width="0.5"/>
    <rect x="52.5" y="36.5" width="7" height="4.6" rx="0.6" fill="#e3c86a" stroke="#a88a3a" stroke-width="0.5"/>
    <path d="M52 41 V46 M56 41 V46 M55 36.5 V41 M58 36.5 V41" stroke="#b09440" stroke-width="0.5"/>
    <path d="M50.5 47.5 L53.5 38" stroke="#6f583a" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M52.8 37.8 L53.9 34.2 M53.5 38 L54.8 34.5 M54.2 38.2 L55.6 34.8 M52.6 38.2 L54.4 38.8" stroke="#6f747a" stroke-width="0.4" stroke-linecap="round"/>
  </g>
  <!-- Water trough in front of the stalls. -->
  <g>
    <ellipse cx="20" cy="53" rx="8" ry="1.2" fill="#8a7447" opacity="0.5"/>
    <rect x="13" y="49" width="14" height="4" fill="#8a6a42" stroke="#5a4028" stroke-width="0.5"/>
    <rect x="13.8" y="49.4" width="12.4" height="1.4" fill="#4f7fa8"/>
    <path d="M15 50 H18 M21 50.2 H24" stroke="#8ac2e6" stroke-width="0.4"/>
    <path d="M14 53 V54.4 M26 53 V54.4" stroke="#5a4028" stroke-width="0.8"/>
  </g>
  <!-- Hitching rail. -->
  <g stroke="#6f583a" stroke-linecap="round">
    <path d="M33 49.5 H45" stroke-width="0.9"/>
    <path d="M34 49.5 V54 M44 49.5 V54" stroke-width="0.9"/>
  </g>
  <path d="M36 57 Q39 56.2 42 57" stroke="#b09a63" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
