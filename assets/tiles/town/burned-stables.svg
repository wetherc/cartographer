<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Empty stall: the Dutch door is gone and the opening is dark. The
         origin is the top-left corner of the opening. -->
    <g id="stall">
      <rect width="8" height="13" fill="#1f1a16"/>
      <rect x="-0.6" y="-0.6" width="9.2" height="0.9" fill="#2e2824"/>
      <path d="M0 13 V9.6 M8 13 V10.4" stroke="#2e2824" stroke-width="0.8"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="10" cy="9" rx="6" ry="3.5" fill="#63a651"/>
  <ellipse cx="56" cy="11" rx="5" ry="3" fill="#529044"/>
  <!-- Scorched yard: browned grass around a sooty dirt patch. -->
  <ellipse cx="30" cy="45" rx="27" ry="11" fill="#7a8a45"/>
  <ellipse cx="30" cy="46" rx="21" ry="7.5" fill="#8a7a5a"/>
  <ellipse cx="28" cy="46.8" rx="23" ry="2.2" fill="#3d342c" opacity="0.45"/>
  <!-- The long timber stable: the boards stand to a ragged line above
       the stalls, scorched black along the top. -->
  <path d="M6 46.5 V31 L9 29.6 L13 31.4 L17 29 L21 30.6 L25 28.6 L30 30.4 L34 28.4 L39 30 L43 28 L48 29.4 V46.5 Z" fill="#8a6c4a"/>
  <path d="M30 46.5 V30.4 L34 28.4 L39 30 L43 28 L48 29.4 V46.5 Z" fill="#7a5e40"/>
  <path d="M6 31 L9 29.6 L13 31.4 L17 29 L21 30.6 L25 28.6 L30 30.4 L34 28.4 L39 30 L43 28 L48 29.4 V33.4 Q40 35 34 33 Q26 35.4 18 33.2 Q11 35 6 33.6 Z" fill="#2e2824" opacity="0.7"/>
  <path d="M6 34 H48 M6 40 H48" stroke="#5a4636" stroke-width="0.4"/>
  <path d="M6 46.5 V31 L9 29.6 L13 31.4 L17 29 L21 30.6 L25 28.6 L30 30.4 L34 28.4 L39 30 L43 28 L48 29.4 V46.5" fill="none" stroke="#2e2824" stroke-width="0.7" stroke-linejoin="round"/>
  <rect x="6" y="45" width="42" height="1.5" fill="#6a6050"/>
  <!-- Charred corner posts and roof posts still standing. -->
  <g fill="#2e2824">
    <rect x="5.4" y="26.4" width="1.4" height="20.1"/>
    <rect x="21.4" y="26" width="1.4" height="20.5"/>
    <rect x="47.2" y="22" width="1.4" height="24.5"/>
  </g>
  <!-- The last scrap of shingle roof at the east end, sagging on one beam. -->
  <path d="M34 28.6 L38 22 H45.4 L51 30 L44 28.4 L40 29.6 Z" fill="#3d2c20"/>
  <path d="M37 25.6 H47.8" stroke="#2e2824" stroke-width="0.6"/>
  <path d="M34 28.6 L38 22 H45.4 L51 30" fill="none" stroke="#2e2824" stroke-width="0.9" stroke-linejoin="round"/>
  <g stroke="#2e2824" stroke-linecap="round" fill="none">
    <path d="M22 26 L30 17.6 L47.8 17.6" stroke-width="1.2"/>
    <path d="M12 33 L16.4 26.4" stroke-width="1"/>
  </g>
  <!-- Smoke from the burned hay loft. -->
  <g fill="#b8b3a8">
    <circle cx="28" cy="24" r="2.2" opacity="0.5"/>
    <circle cx="26" cy="19.6" r="2.8" opacity="0.35"/>
    <circle cx="23" cy="15.4" r="3.3" opacity="0.2"/>
  </g>
  <!-- Three empty stalls, the horses gone. -->
  <use href="#stall" transform="translate(10 33)"/>
  <use href="#stall" transform="translate(23 33)"/>
  <use href="#stall" transform="translate(36 33)"/>
  <!-- A fallen beam across the middle stall, and embers in the straw. -->
  <path d="M21 44.6 L33.4 40.2" stroke="#2e2824" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#e8a040">
    <circle cx="13.6" cy="44.8" r="0.45"/>
    <circle cx="40.4" cy="45" r="0.4"/>
  </g>
  <!-- The hay bales burned to a smouldering heap, the pitchfork left on it. -->
  <g>
    <path d="M50 46 Q50.4 42 53.6 41.4 Q57.4 41 58 46 Z" fill="#3d342c"/>
    <ellipse cx="54" cy="46" rx="4.6" ry="1" fill="#9a958c"/>
    <path d="M51.6 43.4 Q54 42.4 56.4 43.4" stroke="#6a5d4a" stroke-width="0.6" fill="none"/>
    <circle cx="54.6" cy="43.8" r="0.45" fill="#e8a040"/>
    <path d="M49.4 47.4 L58.2 44.6" stroke="#4a3c2c" stroke-width="0.7" stroke-linecap="round"/>
    <path d="M58.2 44.6 L60.4 43.4 M58.4 45 L60.8 44.2 M58.6 45.4 L61 45" stroke="#6f747a" stroke-width="0.4" stroke-linecap="round"/>
  </g>
  <!-- The water trough is tipped on its side and empty. -->
  <g>
    <ellipse cx="20" cy="53.6" rx="8" ry="1.2" fill="#3d342c" opacity="0.45"/>
    <rect x="13" y="50" width="14" height="3.4" fill="#6a5238" stroke="#3d342c" stroke-width="0.5"/>
    <path d="M13 50 L14.4 48.8 H28.4 L27 50" fill="#4a3a28" stroke="#3d342c" stroke-width="0.5" stroke-linejoin="round"/>
    <path d="M27.4 52.4 Q30 53 32 52.2" stroke="#4f7fa8" stroke-width="0.6" fill="none" opacity="0.6"/>
  </g>
  <!-- The hitching rail is broken in the middle. -->
  <g stroke="#4a3c2c" stroke-linecap="round">
    <path d="M33 49.5 H38 L39 50.8 M45 49.5 L41 51" stroke-width="0.9"/>
    <path d="M34 49.5 V54 M44 49.5 V54" stroke-width="0.9"/>
  </g>
  <path d="M36 57 L41.6 56.2" stroke="#3d342c" stroke-width="1.4" stroke-linecap="round"/>
</svg>
