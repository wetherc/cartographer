<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Tall mullioned window, origin at its top-left corner. -->
    <g id="win">
      <rect width="5" height="7" fill="#e8c05a" stroke="#f0e6cf" stroke-width="0.8"/>
      <path d="M2.5 0.4 V6.6 M0.4 3.2 H4.6" stroke="#6b4f33" stroke-width="0.5"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="10" cy="9" rx="6" ry="3.5" fill="#63a651"/>
  <ellipse cx="55" cy="57" rx="6" ry="3" fill="#529044"/>
  <ellipse cx="32" cy="49" rx="25" ry="10" fill="#c2a36c"/>
  <ellipse cx="32" cy="50" rx="19" ry="7" fill="#cdb078"/>
  <ellipse cx="32" cy="51.5" rx="21" ry="2.4" fill="#8a7447" opacity="0.45"/>
  <!-- Brick front with a stepped gable, the east half in shade. -->
  <path d="M15 51.5 V27 H21 V20 H26 V13 H38 V20 H43 V27 H49 V51.5 Z" fill="#b8704a"/>
  <path d="M32 13 H38 V20 H43 V27 H49 V51.5 H32 Z" fill="#a4613f"/>
  <path d="M15 51.5 V27 H21 V20 H26 V13 H38 V20 H43 V27 H49 V51.5" fill="none" stroke="#6f3f28" stroke-width="0.7"/>
  <g fill="#e6dcc3" stroke="#9a8f78" stroke-width="0.35">
    <rect x="14.4" y="26.2" width="7.2" height="1.4"/>
    <rect x="20.4" y="19.2" width="6.2" height="1.4"/>
    <rect x="25.4" y="12.2" width="13.2" height="1.4"/>
    <rect x="37.4" y="19.2" width="6.2" height="1.4"/>
    <rect x="42.4" y="26.2" width="7.2" height="1.4"/>
  </g>
  <!-- Stone string course between the floors. -->
  <rect x="15" y="38.6" width="34" height="1.4" fill="#e6dcc3" stroke="#9a8f78" stroke-width="0.35"/>
  <!-- Round window in the gable, three tall windows above, two below. -->
  <circle cx="32" cy="20.5" r="2.8" fill="#e8c05a" stroke="#f0e6cf" stroke-width="0.8"/>
  <path d="M32 18.1 V22.9 M29.6 20.5 H34.4" stroke="#6b4f33" stroke-width="0.5"/>
  <use href="#win" transform="translate(20.5 29.5)"/>
  <use href="#win" transform="translate(29.5 29.5)"/>
  <use href="#win" transform="translate(38.5 29.5)"/>
  <use href="#win" transform="translate(19 42.5)"/>
  <use href="#win" transform="translate(40 42.5)"/>
  <!-- Double door in a stone surround. -->
  <path d="M27.5 51.5 V45 Q32 39.8 36.5 45 V51.5 Z" fill="#e6dcc3" stroke="#9a8f78" stroke-width="0.4"/>
  <path d="M28.6 51.5 V45.3 Q32 41.2 35.4 45.3 V51.5 Z" fill="#4f3a24"/>
  <path d="M32 43.25 V51.5" stroke="#3a2a19" stroke-width="0.6"/>
  <circle cx="31" cy="47.6" r="0.45" fill="#c9a020"/>
  <circle cx="33" cy="47.6" r="0.45" fill="#c9a020"/>
  <rect x="26.5" y="51.5" width="11" height="1.4" fill="#a39d91"/>
  <!-- Guild sign: a gold key on a blue board, hung from an iron bracket. -->
  <path d="M49 36 H55" stroke="#3a352e" stroke-width="0.7"/>
  <path d="M51 36 V37.2 M54 36 V37.2" stroke="#3a352e" stroke-width="0.4"/>
  <rect x="50" y="37.2" width="5" height="4.6" rx="0.5" fill="#2f5f8f" stroke="#c9a020" stroke-width="0.5"/>
  <g stroke="#e8c05a" stroke-width="0.6" fill="none">
    <circle cx="52.5" cy="38.6" r="0.8"/>
    <path d="M52.5 39.4 V41.1 M52.5 40.3 H53.4 M52.5 41 H53.2"/>
  </g>
</svg>
