<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Mesa: pale flat top over a striped cliff, shaded on the east third. -->
    <g id="ms">
      <ellipse cx="2" cy="0.6" rx="13" ry="2.4" fill="#8a4a2c" opacity="0.6"/>
      <path d="M-10 -7.5 L10 -8 L11.5 0 L-11.5 0 Z" fill="#a4552f"/>
      <path d="M-10.5 -5 L10.5 -5.4 M-11 -2.4 L11 -2.6" stroke="#c8784a" stroke-width="1.1"/>
      <path d="M-11.2 -1 L11.2 -1.1" stroke="#8a4426" stroke-width="0.8"/>
      <path d="M4 -7.9 L10 -8 L11.5 0 L5 0 Z" fill="#7a3c22" opacity="0.45"/>
      <path d="M-10 -7.5 L-7 -11 L5 -11.6 L10 -8 Z" fill="#d4935c"/>
      <path d="M-6 -9.6 L3 -10" stroke="#e2aa74" stroke-width="0.8" stroke-linecap="round"/>
    </g>
    <g id="bt">
      <ellipse cx="1.5" cy="0.5" rx="5" ry="1.4" fill="#8a4a2c" opacity="0.6"/>
      <path d="M-3 -9 L3 -9.2 L4.2 0 L-4.2 0 Z" fill="#a4552f"/>
      <path d="M-3.6 -5.6 L3.8 -5.8 M-4 -2.6 L4 -2.7" stroke="#c8784a" stroke-width="1"/>
      <path d="M1.4 -9.1 L3 -9.2 L4.2 0 L1.8 0 Z" fill="#7a3c22" opacity="0.45"/>
      <path d="M-3 -9 L-2 -10.8 L2.2 -11 L3 -9.2 Z" fill="#d4935c"/>
    </g>
    <g id="pb" fill="#9a5230">
      <ellipse cx="0" cy="0" rx="1.8" ry="1.1"/>
      <ellipse cx="3" cy="1" rx="1.1" ry="0.7"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#b0643a"/>
  <!-- Edge pebbles: identical across badlands variants, stamped in wrapped
       pairs (a stamp that crosses x=0 repeats at +64, likewise y, corners
       at all four). Buttes and mesas stay inset and move between variants,
       because a landform at the same spot on every tile forms rows at the
       64-pixel tile pitch. -->
  <g>
    <use href="#pb" transform="translate(-1 -1)"/>
    <use href="#pb" transform="translate(63 -1)"/>
    <use href="#pb" transform="translate(-1 63)"/>
    <use href="#pb" transform="translate(63 63)"/>
    <use href="#pb" transform="translate(-1 50)"/>
    <use href="#pb" transform="translate(63 50)"/>
    <use href="#pb" transform="translate(42 -1)"/>
    <use href="#pb" transform="translate(42 63)"/>
  </g>
  <!-- Ground patches, dry washes and cracks, then landforms farthest (highest
       base) first. -->
  <g fill="#a65b33">
    <ellipse cx="44" cy="20" rx="10" ry="6"/>
    <ellipse cx="22" cy="50" rx="12" ry="6"/>
  </g>
  <g fill="#bc7244">
    <ellipse cx="14" cy="42" rx="9" ry="5"/>
    <ellipse cx="50" cy="30" rx="9" ry="5"/>
  </g>
  <path d="M30 44 Q38 40 44 43 T58 42" stroke="#9a5230" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <use href="#ms" transform="translate(20 26)"/>
  <use href="#pb" transform="translate(40 30)"/>
  <use href="#bt" transform="translate(48 56) scale(0.9)"/>
  <use href="#pb" transform="translate(16 52)"/>
</svg>
