<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Jagged basalt peak: lit west face, shaded east face, crags on both,
         a branching lava streak, and embers on the shaded flank. -->
    <g id="pk">
      <polygon points="-15,0 -7,-19 -4,-21 0,-30 4,-23 7,-20 15,0" fill="#2f2527"/>
      <polygon points="-15,0 -7,-19 -4,-21 0,-30 0,0" fill="#5c4a45"/>
      <path d="M-14.4 -1.4 L-7 -19 L-4 -21 L0 -30" stroke="#7a665f" stroke-width="0.8" fill="none" stroke-linejoin="round"/>
      <path d="M-6 -14 L-9 -5 M-3 -18 L-4.5 -10 M-10 -4 L-11.5 -1" stroke="#6f5c56" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M5 -17 L7 -10 M10 -8 L11.5 -3" stroke="#221a1b" stroke-width="0.9" stroke-linecap="round"/>
      <g fill="none" stroke-linecap="round">
        <path d="M1.6 -25 Q4 -16 3 -9 Q2.4 -4 5.4 0 M3 -9 Q6 -6 8.5 -1" stroke="#ff6a2a" stroke-width="3.4" opacity="0.3"/>
        <path d="M1.6 -25 Q4 -16 3 -9 Q2.4 -4 5.4 0" stroke="#e8541e" stroke-width="1.5"/>
        <path d="M3 -9 Q6 -6 8.5 -1" stroke="#e8541e" stroke-width="1.1"/>
        <path d="M1.6 -25 Q4 -16 3 -9 Q2.4 -4 5.4 0 M3 -9 Q6 -6 8.5 -1" stroke="#ffb347" stroke-width="0.45"/>
      </g>
      <g fill="#ffb347">
        <circle cx="5.2" cy="-14" r="0.45"/><circle cx="9.5" cy="-5" r="0.45"/><circle cx="1.6" cy="-4" r="0.4"/>
      </g>
    </g>
    <!-- Cone: truncated top with a glowing crater, a lava tongue, and a
         two-tone ash plume. -->
    <g id="cn">
      <polygon points="-14,0 -4,-20 4,-20 14,0" fill="#2f2527"/>
      <polygon points="-14,0 -4,-20 0,-20 0,0" fill="#5c4a45"/>
      <path d="M-13.4 -1.2 L-4 -20" stroke="#7a665f" stroke-width="0.8" fill="none"/>
      <path d="M-7 -8 L-9.5 -3 M-4 -14 L-5 -9" stroke="#6f5c56" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M7 -9 L9 -4" stroke="#221a1b" stroke-width="0.9" stroke-linecap="round"/>
      <ellipse cx="0" cy="-20" rx="6.4" ry="2.8" fill="#ff6a2a" opacity="0.25"/>
      <ellipse cx="0" cy="-20" rx="4.6" ry="1.8" fill="#231b1c"/>
      <ellipse cx="0" cy="-20" rx="3.6" ry="1.2" fill="#e8541e"/>
      <ellipse cx="-0.3" cy="-20.2" rx="2.2" ry="0.6" fill="#ffd24a"/>
      <g fill="none" stroke-linecap="round">
        <path d="M1.4 -19 Q3.2 -13 2 -8 Q1.2 -3.5 4 0" stroke="#ff6a2a" stroke-width="3.4" opacity="0.3"/>
        <path d="M1.4 -19 Q3.2 -13 2 -8 Q1.2 -3.5 4 0" stroke="#e8541e" stroke-width="1.5"/>
        <path d="M1.4 -19 Q3.2 -13 2 -8 Q1.2 -3.5 4 0" stroke="#ffb347" stroke-width="0.45"/>
      </g>
      <g fill="#6f6460" opacity="0.85">
        <circle cx="0.5" cy="-24" r="2.8"/>
        <circle cx="3.4" cy="-27.4" r="2.4"/>
        <circle cx="1.4" cy="-30.8" r="1.9"/>
        <circle cx="4" cy="-33.4" r="1.4"/>
      </g>
      <g fill="#978b86" opacity="0.8">
        <circle cx="-0.4" cy="-24.8" r="1.4"/>
        <circle cx="2.6" cy="-28.2" r="1.2"/>
        <circle cx="0.8" cy="-31.4" r="0.9"/>
      </g>
    </g>
    <g id="br">
      <ellipse cx="0.5" cy="1.8" rx="5.5" ry="1.4" fill="#2b211f" opacity="0.6"/>
      <path d="M-5 2 L-3.5 -2.5 L0 -4 L4 -2 L5 2 Z" fill="#3d302c"/>
      <path d="M0 -4 L4 -2 L5 2 L0.5 2 Z" fill="#2a201e"/>
      <path d="M-3.5 -2.5 L0 -4 L0.5 -1.5 Z" fill="#5a4944"/>
    </g>
    <g id="lp">
      <ellipse cx="0" cy="0" rx="6.6" ry="3" fill="#ff6a2a" opacity="0.22"/>
      <ellipse cx="0" cy="0" rx="5.4" ry="2.2" fill="#2a1f1d"/>
      <ellipse cx="0" cy="-0.2" rx="4.2" ry="1.5" fill="#e8541e"/>
      <ellipse cx="-0.8" cy="-0.5" rx="2.4" ry="0.7" fill="#ffb347"/>
      <path d="M5 0.6 Q7 1.6 9 1.2" stroke="#e2561d" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Cooled flow: a dark crusted lobe with ropy ridges and hot cracks. -->
    <g id="cf">
      <path d="M-9 1 Q-10.5 -1.5 -7.5 -2.8 Q-6 -5 -2.5 -4.2 Q0 -6 3 -4.6 Q6.5 -5 7.5 -2.6 Q10.5 -1.4 9 1 Q4 2.4 0 1.6 Q-4 2.6 -9 1 Z" fill="#2e2422"/>
      <path d="M-7 -1.4 Q-4 -3.6 -1 -2.2 T5 -2.4 M-5 -3.2 Q-2 -4.6 2 -3.8" stroke="#40332f" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <path d="M-6 -0.4 L-3 -1.6 L-0.4 -0.6 L3 -2 L6 -0.8 M-3 -1.6 L-2.2 -3.4 M3 -2 L3.8 -3.8" stroke="#e2561d" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-3 -1.6 L-0.4 -0.6 L3 -2" stroke="#ffb347" stroke-width="0.3" fill="none"/>
    </g>
    <!-- Fumarole: a sulfur crust around a vent, with steam rising. -->
    <g id="fm">
      <ellipse cx="0" cy="0" rx="4.2" ry="1.7" fill="#9d8a36"/>
      <ellipse cx="-0.3" cy="-0.2" rx="2.8" ry="1" fill="#d8c65a"/>
      <ellipse cx="0" cy="-0.1" rx="1" ry="0.45" fill="#2a201e"/>
      <g fill="#c2b9b3" opacity="0.55">
        <circle cx="0.4" cy="-3" r="1.7"/>
        <circle cx="1.8" cy="-5.8" r="1.4"/>
        <circle cx="0.8" cy="-8.4" r="1.05"/>
      </g>
    </g>
    <g id="ob">
      <polygon points="-2.4,1 -1.2,-3.4 0.8,1" fill="#1c1719"/>
      <polygon points="0.2,1 2,-2.2 3.4,1" fill="#262024"/>
      <path d="M-1.8 -0.6 L-1.2 -2.8 M1.2 -0.4 L1.9 -1.6" stroke="#8d8296" stroke-width="0.5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#4a3a36"/>
  <g fill="#554540">
    <ellipse cx="34" cy="6" rx="8" ry="3"/>
    <ellipse cx="54" cy="58" rx="6" ry="2.4"/>
  </g>
  <!-- Ridge bands and edge outcrops: identical across volcanic variants.
       The far band passes through y=22 and the near band through y=38 at
       both x=0 and x=64, and each outcrop is stamped in wrapped pairs (a
       stamp that crosses x=0 repeats at +64, likewise y, corners at all
       four), so ranges continue across seams. -->
  <path d="M0 22 L7 18 L14 21 L22 15 L30 20 L38 16 L47 22 L56 17 L64 22 L64 40 L0 40 Z" fill="#524039"/>
  <path d="M0 22 L7 18 L14 21 L22 15 L30 20 L38 16 L47 22 L56 17 L64 22" stroke="#5f4d46" stroke-width="0.8" fill="none" stroke-linejoin="round"/>
  <path d="M0 38 L9 33 L17 37 L26 30 L35 36 L44 31 L54 40 L64 38 L64 50 L0 50 Z" fill="#3f302d"/>
  <g>
    <use href="#br" transform="translate(0 0) scale(0.8)"/>
    <use href="#br" transform="translate(64 0) scale(0.8)"/>
    <use href="#br" transform="translate(0 64) scale(0.8)"/>
    <use href="#br" transform="translate(64 64) scale(0.8)"/>
    <use href="#br" transform="translate(1 24) scale(0.75)"/>
    <use href="#br" transform="translate(65 24) scale(0.75)"/>
    <use href="#br" transform="translate(-2 55) scale(-0.7 0.7)"/>
    <use href="#br" transform="translate(62 55) scale(-0.7 0.7)"/>
    <use href="#br" transform="translate(20 1) scale(-0.8 0.8)"/>
    <use href="#br" transform="translate(20 65) scale(-0.8 0.8)"/>
    <use href="#br" transform="translate(42 -2) scale(0.7)"/>
    <use href="#br" transform="translate(42 62) scale(0.7)"/>
  </g>
  <!-- Cinders: dark grit and a few embers, inset from the edges. -->
  <g fill="#2b211f">
    <circle cx="9" cy="12" r="0.6"/><circle cx="30" cy="11" r="0.5"/><circle cx="52" cy="26" r="0.6"/>
    <circle cx="12" cy="30" r="0.5"/><circle cx="38" cy="26" r="0.5"/><circle cx="26" cy="60" r="0.6"/>
  </g>
  <g fill="#ff8a3a">
    <circle cx="24" cy="8" r="0.4"/><circle cx="58" cy="12" r="0.4"/><circle cx="18" cy="26" r="0.35"/>
  </g>
  <!-- Inset details and peaks, farthest (highest base) first. -->
  <use href="#fm" transform="translate(14 12) scale(0.9)"/>
  <use href="#lp" transform="translate(42 10) scale(0.9)"/>
  <g fill="#2b211f" opacity="0.55">
    <ellipse cx="24" cy="54.5" rx="14" ry="2"/>
    <ellipse cx="44" cy="54.5" rx="15" ry="2.2"/>
  </g>
  <use href="#pk" transform="translate(24 54) scale(0.85)"/>
  <use href="#pk" transform="translate(44 54) scale(0.95 1.05)"/>
  <use href="#ob" transform="translate(10 59) scale(0.9)"/>
  <use href="#cf" transform="translate(38 60) scale(0.7)"/>
</svg>
