<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="10" cy="56" rx="7" ry="3.5" fill="#529044"/>
  <ellipse cx="54" cy="12" rx="7" ry="4" fill="#63a651"/>
  <!-- Scorched yard around the base. -->
  <ellipse cx="33" cy="50" rx="24" ry="10" fill="#7a8a45"/>
  <ellipse cx="33" cy="50" rx="21" ry="8.5" fill="#8a7a5a"/>
  <ellipse cx="33" cy="50" rx="15" ry="6" fill="#6a6050"/>
  <!-- Smoke from the open top of the tower. -->
  <g fill="#b8b3a8">
    <circle cx="30" cy="16" r="2" opacity="0.5"/>
    <circle cx="32.5" cy="12" r="2.6" opacity="0.35"/>
    <circle cx="35.5" cy="8.5" r="3" opacity="0.2"/>
  </g>
  <!-- Study wing: the roof has fallen in, leaving one charred beam. -->
  <path d="M34 52 V40 L36.5 38.6 L39 40.4 L42 38 L45.5 40 L48 38.4 L50 39.6 V52 Z" fill="#9d98ac" stroke="#5f5a70" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M42 38 L45.5 40 L48 38.4 L50 39.6 V52 H42 Z" fill="#8f8a9e"/>
  <path d="M37.4 39.2 L49.6 36.4" stroke="#2e2824" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M40 42 L40 46.5 L45 46.5 L45 42 Q42.5 40 40 42 Z" fill="#2e2824"/>
  <path d="M40 46.5 L41.4 44.6 L42.4 46.5 Z" fill="#6a8a9a"/>
  <!-- Tower body, broken off unevenly below the old roof line, with soot
       above the window. -->
  <path d="M21 52 L22.1 26 L24.4 24.2 L26.6 26.4 L29.4 22.8 L32 25.6 L34 24 L35.9 26.8 L37 52 Z" fill="#8f8a9e" stroke="#5f5a70" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M21.4 51.6 L22.5 26.2 L24.4 24.6 L26.6 26.8 L29 23.6 L29 51.6 Z" fill="#9d98ac"/>
  <path d="M22.3 35 L35.7 35 M21.9 44 L36.1 44" stroke="#767185" stroke-width="0.7" fill="none"/>
  <path d="M25 30.5 h3 M31 39.5 h3 M25.5 48 h3" stroke="#767185" stroke-width="0.7"/>
  <path d="M29 29 Q30 27 29.4 25" stroke="#4a4540" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M33 36 L34.2 38.6 L33.4 41" stroke="#5f5a70" stroke-width="0.5" fill="none"/>
  <!-- Balcony ring, broken on the east side. -->
  <path d="M20 35.5 h12.5 l-1 2.4 h-11.5 Z" fill="#7c7790" stroke="#5f5a70" stroke-width="0.5"/>
  <path d="M36 35.5 h2 v2.4 h-2 Z" fill="#7c7790" stroke="#5f5a70" stroke-width="0.5"/>
  <!-- Arched window, dark and empty, with a faint arcane flicker. -->
  <path d="M26.4 32.5 L26.4 28 Q29 25 31.6 28 L31.6 32.5 Z" fill="#2e2824"/>
  <circle cx="28.4" cy="30.6" r="0.6" fill="#7ec8e8" opacity="0.8"/>
  <!-- Door split and hanging open. -->
  <path d="M25.8 52 L25.8 46.5 Q29 43.6 32.2 46.5 L32.2 52 Z" fill="#2e2824"/>
  <path d="M25.8 52 L25.8 46.5 Q26.8 45.4 27.8 45.2 L28.6 52 Z" fill="#4a3a5c"/>
  <!-- Fallen roof slates and the gold finial on the ground. -->
  <g>
    <path d="M12 50 L17 47.6 L18 49.6 L13.2 51.8 Z" fill="#6b4a8c" stroke="#452f5c" stroke-width="0.5"/>
    <path d="M42.6 55 L47 53.6 L47.6 55 L43.2 56.2 Z" fill="#523a6d"/>
    <path d="M14.6 45 L17.4 44 L17.8 45.2 L15 46 Z" fill="#523a6d"/>
    <circle cx="19.6" cy="53.4" r="1.2" fill="#b8a86a"/>
  </g>
  <!-- Stones from the broken top, spilled around the base. -->
  <g fill="#8f8a9e" stroke="#5f5a70" stroke-width="0.4">
    <ellipse cx="17.4" cy="52.6" rx="1.6" ry="1.1"/>
    <ellipse cx="38.6" cy="54.4" rx="1.6" ry="1.1"/>
    <ellipse cx="36" cy="55.6" rx="1.2" ry="0.8"/>
    <ellipse cx="51.6" cy="50" rx="1.4" ry="1"/>
  </g>
  <ellipse cx="23" cy="55.4" rx="3.2" ry="1.2" fill="#9a958c"/>
</svg>
