<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Whitewashed cottage under a hipped thatch roof. The origin is the
         top-left corner of the wall, and the east half is the shaded side. -->
    <g id="cottage">
      <rect width="14" height="9" fill="#e6dcc4"/>
      <rect x="7" width="7" height="9" fill="#d4c8ac"/>
      <rect width="14" height="9" fill="none" stroke="#9a8a6a" stroke-width="0.6"/>
      <rect x="5.5" y="4" width="3" height="5" fill="#5a4530"/>
      <rect x="1.8" y="2.6" width="2.4" height="2.4" fill="#7a6a4a" stroke="#5f5138" stroke-width="0.5"/>
      <rect x="9.8" y="2.6" width="2.4" height="2.4" fill="#6d5f42" stroke="#5f5138" stroke-width="0.5"/>
      <polygon points="-2,1 3,-7 11,-7 16,1" fill="#c9a55a"/>
      <polygon points="7,-7 11,-7 16,1 7,1" fill="#a8843f"/>
      <path d="M-2 1 Q7 2.6 16 1" stroke="#8f6f35" stroke-width="0.9" fill="none" stroke-linecap="round"/>
      <path d="M3 -7 L11 -7" stroke="#8f6f35" stroke-width="0.7"/>
      <path d="M1.5 -1.5 L3 -4.5 M4.5 -1 L5.5 -4.5 M9.5 -1 L9 -4.5 M12.5 -1.5 L11.5 -4.5" stroke="#b08d48" stroke-width="0.5" fill="none"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="12" cy="10" rx="8" ry="4.5" fill="#63a651"/>
  <ellipse cx="54" cy="12" rx="6" ry="3.5" fill="#529044"/>
  <ellipse cx="32" cy="40" rx="25" ry="13" fill="#c2a36c"/>
  <ellipse cx="32" cy="40" rx="19" ry="9" fill="#cdb078"/>
  <!-- Back cottage with a smoking chimney. -->
  <rect x="35" y="10" width="2" height="4.5" fill="#8a8f94"/>
  <g fill="#d8d4ca" opacity="0.7">
    <circle cx="36.5" cy="7.5" r="1.4"/>
    <circle cx="38" cy="5" r="1.7"/>
    <circle cx="40" cy="2.8" r="1.3"/>
  </g>
  <use href="#cottage" transform="translate(25 19)"/>
  <use href="#cottage" transform="translate(8 33)"/>
  <use href="#cottage" transform="translate(42 31)"/>
  <!-- Village well on the green between the cottages. -->
  <g>
    <ellipse cx="32" cy="47.4" rx="5" ry="1.4" fill="#2b5228" opacity="0.3"/>
    <rect x="28" y="42" width="8" height="5" fill="#a39d91" stroke="#5c574e" stroke-width="0.6"/>
    <rect x="32" y="42.3" width="3.7" height="4.4" fill="#8a8479"/>
    <path d="M28 44.5 H36 M30.5 42 V44.5 M33.5 44.5 V47" stroke="#6f6a60" stroke-width="0.5"/>
    <ellipse cx="32" cy="42" rx="4" ry="1.4" fill="#2c2820" stroke="#5c574e" stroke-width="0.6"/>
    <rect x="28.3" y="35.5" width="1" height="6.5" fill="#6f583a"/>
    <rect x="34.7" y="35.5" width="1" height="6.5" fill="#6f583a"/>
    <path d="M28.8 37 H35.2" stroke="#5f4529" stroke-width="0.7"/>
    <polygon points="27,36 32,32.5 37,36" fill="#8a6f4a"/>
    <polygon points="32,32.5 37,36 32,36" fill="#6f583a"/>
    <path d="M32 37 V40" stroke="#b09a72" stroke-width="0.5"/>
    <rect x="31" y="39.6" width="2" height="1.6" fill="#8a6f4a" stroke="#5f4529" stroke-width="0.4"/>
  </g>
  <!-- Haystack and a short fence by the west cottage. -->
  <g>
    <ellipse cx="13" cy="53.5" rx="5.5" ry="1.4" fill="#2b5228" opacity="0.35"/>
    <path d="M8 53.5 Q8 46 13 46 Q18 46 18 53.5 Z" fill="#d6b35a"/>
    <path d="M13 46 Q18 46 18 53.5 L13 53.5 Z" fill="#b8963f"/>
    <path d="M10 50 Q13 49 16 50 M9.3 52 Q13 51 16.8 52" stroke="#a8843f" stroke-width="0.5" fill="none"/>
  </g>
  <g fill="#8a6f4a">
    <rect x="20" y="49" width="1.4" height="5"/>
    <rect x="25" y="49.5" width="1.4" height="5"/>
  </g>
  <path d="M20 50.8 L26.4 51.2 M20 52.8 L26.4 53.2" stroke="#8a6f4a" stroke-width="1" fill="none"/>
  <!-- Tree beside the east cottage. -->
  <g>
    <ellipse cx="51" cy="52" rx="6" ry="2.6" fill="#2b5228" opacity="0.5"/>
    <path d="M50.2 52 L50 47 L52 47 L51.8 52 Z" fill="#5a4028"/>
    <circle cx="49" cy="45" r="3.5" fill="#3f7a34"/>
    <circle cx="53" cy="44.5" r="3.6" fill="#3f7a34"/>
    <circle cx="51" cy="42" r="3.2" fill="#4c8a40"/>
  </g>
  <path d="M29 56 Q32 55 35 56" stroke="#b09a63" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
