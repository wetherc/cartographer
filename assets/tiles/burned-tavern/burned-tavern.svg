<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="50" cy="11" rx="8" ry="4.5" fill="#63a651"/>
  <ellipse cx="12" cy="56" rx="7" ry="4" fill="#529044"/>
  <!-- Scorched yard: browned grass around a sooty dirt patch. -->
  <ellipse cx="32" cy="43" rx="23" ry="12" fill="#7a8a45"/>
  <ellipse cx="32" cy="43" rx="20" ry="10" fill="#8a7a5a"/>
  <ellipse cx="32" cy="44" rx="14" ry="7" fill="#6a6050"/>
  <!-- Smoke from the rubble inside. -->
  <g fill="#b8b3a8">
    <circle cx="28" cy="20" r="2" opacity="0.5"/>
    <circle cx="30.5" cy="16" r="2.6" opacity="0.35"/>
    <circle cx="33.5" cy="12.5" r="3" opacity="0.2"/>
  </g>
  <!-- Walls burned down to a ragged line. The thatch is gone, and one
       charred ridge pole leans on the gable end. -->
  <path d="M16 47 V32 L19 30 L22 32.6 L25.5 29.4 L29 31.6 L32.5 29.8 L36 32.4 L39.5 30 L44 31.6 V47 Z" fill="#a8977a" stroke="#6a5d4a" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M22 32.6 L25.5 29.4 L29 31.6 V38 H22 Z M36 32.4 L39.5 30 L44 31.6 V38 H36 Z" fill="#8a7b62"/>
  <path d="M18 31.4 V47 M42 30.6 V47 M16 38 H44" stroke="#2e2824" stroke-width="1.2"/>
  <g stroke="#2e2824" stroke-linecap="round">
    <path d="M15 31.4 L24 24.2" stroke-width="1.2"/>
    <path d="M45 31.6 L38.6 27" stroke-width="1"/>
  </g>
  <!-- Clumps of burned thatch caught on the wall top. -->
  <path d="M19 30 q1.4 -1.2 3 0.4 q-1.4 1 -3 -0.4 Z M38.6 30.4 q1.6 -1 3 0.2 q-1.6 0.9 -3 -0.2 Z" fill="#5a4a2a"/>
  <path d="M26 38 Q27 42 26.5 45 M35 38 Q34.2 41 34.6 43" stroke="#6a5d4a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Door gone and windows empty. -->
  <rect x="27" y="39" width="6" height="8" fill="#2e2824"/>
  <path d="M27 39 Q30 37 33 39" fill="#2e2824"/>
  <path d="M28.4 47 L30.4 43.8 L32 47 Z" fill="#9a958c"/>
  <g fill="#2e2824" stroke="#4a3a2c" stroke-width="0.7">
    <rect x="19.5" y="33" width="4.5" height="4"/>
    <rect x="36" y="33" width="4.5" height="4"/>
  </g>
  <circle cx="21.2" cy="36" r="0.45" fill="#e8a040"/>
  <!-- Sign post burned through; the mug sign lies on the ground. -->
  <g>
    <rect x="47.2" y="40" width="1.6" height="7" fill="#3d342c"/>
    <path d="M47.2 40 L48 39.1 L48.8 40 Z" fill="#2e2824"/>
    <path d="M46 50.4 L55.4 49.2" stroke="#3d342c" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="49.4" y="50" width="6" height="3.2" rx="0.8" fill="#5a4a36" stroke="#3d342c" stroke-width="0.6"/>
    <path d="M51 50.6 h2 v2 h-2 Z" fill="#b8ad96"/>
  </g>
  <!-- Barrel by the door, charred and burst, with staves on the ground. -->
  <g>
    <path d="M10.5 44 q-0.6 2 0 4 h5 q0.6 -2 0 -4 L14 45 L12.6 43.6 L11.4 44.8 Z" fill="#5a4a36"/>
    <path d="M10.2 45.6 h5.6" stroke="#3d342c" stroke-width="0.8"/>
    <path d="M16.6 49.4 L20.8 48.8 M9 50.4 L12.8 51" stroke="#5a4a36" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Ash in front of the door. -->
  <g>
    <ellipse cx="38" cy="50.4" rx="3.6" ry="1.4" fill="#9a958c"/>
    <ellipse cx="37.4" cy="50" rx="1.8" ry="0.7" fill="#b8b3a8"/>
  </g>
</svg>
