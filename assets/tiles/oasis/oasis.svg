<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One palm frond: a drooping leaf from the crown at the origin, with
         a darker midrib. -->
    <g id="frond">
      <path d="M0 0 Q5 -3.6 11 0.8 Q5.5 -0.6 0 0 Z" fill="#3f7a34"/>
      <path d="M0 0 Q5.5 -1.6 11 0.8" stroke="#2f5f28" stroke-width="0.5" fill="none"/>
    </g>
    <g id="crown">
      <use href="#frond" transform="rotate(-160)"/>
      <use href="#frond" transform="rotate(-120)"/>
      <use href="#frond" transform="rotate(-60)"/>
      <use href="#frond" transform="rotate(-20)"/>
      <use href="#frond" transform="rotate(20)"/>
      <use href="#frond" transform="scale(-1 1) rotate(20)"/>
      <use href="#frond" transform="rotate(-90) scale(0.8)"/>
      <circle cx="-0.8" cy="1.2" r="0.9" fill="#6f4a2a"/>
      <circle cx="0.9" cy="1.3" r="0.9" fill="#5a3a20"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="12" cy="10" rx="8" ry="4" fill="#63a651"/>
  <ellipse cx="54" cy="56" rx="7" ry="3.5" fill="#529044"/>
  <!-- Pool with a sandy rim, a deep center, and ripples. -->
  <ellipse cx="33" cy="43" rx="22" ry="12" fill="#c2a36c"/>
  <ellipse cx="33" cy="43" rx="20" ry="10.5" fill="#cdb078"/>
  <ellipse cx="33" cy="43.5" rx="16.5" ry="8" fill="#33719f"/>
  <ellipse cx="35" cy="45" rx="10" ry="4.5" fill="#2d6591"/>
  <path d="M17 42 Q33 35.5 49.5 42" stroke="#8ac2e6" stroke-width="1" fill="none" opacity="0.6"/>
  <g fill="none" stroke="#8ac2e6" stroke-width="0.9" stroke-linecap="round">
    <path d="M24 45 Q26 44 28 45"/>
    <path d="M38 48.5 Q40.5 47.5 43 48.5"/>
  </g>
  <circle cx="30" cy="48" r="0.6" fill="#8ac2e6"/>
  <!-- Reeds and stones at the water's edge. -->
  <g stroke="#6f8a3a" stroke-width="0.8" stroke-linecap="round" fill="none">
    <path d="M47 47 L46.4 42 M48.2 47.2 L48.6 41.6 M49.4 46.8 L50.6 43"/>
    <path d="M18 48 L17.2 44 M19.2 48.4 L19.4 43.6"/>
  </g>
  <g fill="#7a5a38">
    <ellipse cx="46.4" cy="41.8" rx="0.5" ry="1.2"/>
    <ellipse cx="48.6" cy="41.4" rx="0.5" ry="1.2"/>
  </g>
  <g>
    <ellipse cx="25" cy="54" rx="2.2" ry="1.3" fill="#a39d91"/>
    <ellipse cx="25.6" cy="54.3" rx="1.4" ry="0.8" fill="#8a8479"/>
    <ellipse cx="41" cy="54.4" rx="1.6" ry="1" fill="#a39d91"/>
  </g>
  <!-- Three date palms: shadows on the ground, ringed trunks, and crowns. -->
  <g fill="#2b5228" opacity="0.35">
    <ellipse cx="13" cy="41" rx="5" ry="1.4"/>
    <ellipse cx="53" cy="38" rx="5" ry="1.4"/>
    <ellipse cx="40" cy="31" rx="4" ry="1.1"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M40 31 Q40.6 26 39 21" stroke="#7a5a38" stroke-width="1.8"/>
    <path d="M40 31 Q40.6 26 39 21" stroke="#a3865c" stroke-width="1.8" stroke-dasharray="1 1.1"/>
    <path d="M13 41 Q13 30 18.5 19" stroke="#7a5a38" stroke-width="2.4"/>
    <path d="M13 41 Q13 30 18.5 19" stroke="#a3865c" stroke-width="2.4" stroke-dasharray="1.2 1.3"/>
    <path d="M53 38 Q53.5 27 48.5 15" stroke="#7a5a38" stroke-width="2.4"/>
    <path d="M53 38 Q53.5 27 48.5 15" stroke="#a3865c" stroke-width="2.4" stroke-dasharray="1.2 1.3"/>
  </g>
  <use href="#crown" transform="translate(39 21) scale(0.75)"/>
  <use href="#crown" transform="translate(18.5 19)"/>
  <use href="#crown" transform="translate(48.5 15)"/>
</svg>
