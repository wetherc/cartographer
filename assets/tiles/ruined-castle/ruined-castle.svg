<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- East half: the shaded side of every wall and tower. -->
    <clipPath id="east"><rect x="32" width="32" height="64"/></clipPath>
    <g id="stone">
      <ellipse cx="0" cy="0" rx="1.6" ry="1.1" fill="#9a948a" stroke="#5c574e" stroke-width="0.4"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="12" cy="10" rx="8" ry="4.5" fill="#63a651"/>
  <ellipse cx="54" cy="58" rx="7" ry="3.5" fill="#529044"/>
  <ellipse cx="32" cy="48" rx="25" ry="10" fill="#8a7a5a"/>
  <ellipse cx="32" cy="48" rx="20" ry="7.5" fill="#9a8a66"/>
  <!-- Keep, gutted: the battlements are gone and the top is broken off
       unevenly, with soot above the empty windows. -->
  <g>
    <path d="M24 34 V17 L26 15.2 L28 17.4 L30.5 14 L33 16.8 L35 15.4 L37.5 18.6 L40 17 V34 Z" fill="#b0aa9e" stroke="#5c574e" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M24 34 V17 L26 15.2 L28 17.4 L30.5 14 L33 16.8 L35 15.4 L37.5 18.6 L40 17 V34 Z" fill="#9a948a" stroke="#5c574e" stroke-width="0.9" stroke-linejoin="round" clip-path="url(#east)"/>
    <path d="M25.4 20 Q27.8 17 30.2 20 V23 H25.4 Z M33.8 20 Q36.2 17.6 38.6 20 V23 H33.8 Z" fill="#4a4540" opacity="0.8"/>
    <rect x="26.6" y="21" width="2.4" height="4.5" rx="1.2" fill="#2c2820"/>
    <rect x="35" y="21" width="2.4" height="4.5" rx="1.2" fill="#2c2820"/>
    <path d="M31 27 L32.2 29.4 L31.4 31.6" stroke="#5c574e" stroke-width="0.5" fill="none"/>
  </g>
  <!-- Curtain wall with a breach west of the gate, its stones spilled
       onto the yard. -->
  <path d="M14 32 H17.5 L19 36 L21 38.5 L23.5 36.5 L25 32 H50 V48 H14 Z" fill="#a39d91"/>
  <rect x="32" y="32" width="18" height="16" fill="#938d82"/>
  <path d="M17.5 32 L19 36 L21 38.5 L23.5 36.5 L25 32 Z" fill="#6a6443"/>
  <g stroke="#7a7468" stroke-width="0.7" fill="none">
    <path d="M14 37 H18.7 M38 37 H50 M14 42.5 H26 M38 42.5 H50"/>
    <path d="M42 32 V37 M46 37 V42.5 M18 42.5 V48 M42 42.5 V48"/>
  </g>
  <path d="M14 48 V32 H17.5 L19 36 L21 38.5 L23.5 36.5 L25 32 H50 V48 Z" fill="none" stroke="#5c574e" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M41 32 v-2.5 h3 v2.5 Z" fill="#938d82" stroke="#5c574e" stroke-width="0.8"/>
  <path d="M44 34 Q47 36 46 40" stroke="#4a4540" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- West tower stands to full height with its roof burned away and
       a few charred beams left. The east tower is broken to half height. -->
  <g stroke="#5c574e" stroke-width="0.9">
    <path d="M7 50 V24 L9.5 22.6 L12 24.4 L15 22 L19 24 V50 Z" fill="#b0aa9e" stroke-linejoin="round"/>
    <path d="M45 50 V35 L47 33.4 L49.5 36 L52 32.6 L55 35.4 L57 34 V50 Z" fill="#9a948a" stroke-linejoin="round"/>
  </g>
  <path d="M13 24 L15 22 L18.55 23.8 V49.55 H13 Z" fill="#9a948a"/>
  <path d="M51 34.2 L52 32.6 L55 35.4 L56.55 34.3 V49.55 H51 Z" fill="#8a8479"/>
  <g stroke="#2e2824" stroke-width="1" stroke-linecap="round">
    <path d="M8.5 23.4 L12.6 17.2 M17.6 23.4 L14 18.6"/>
  </g>
  <path d="M7.6 24 Q13 21.6 18.4 24.2" stroke="#3d342c" stroke-width="1.2" fill="none" opacity="0.6"/>
  <g fill="#3a3630">
    <rect x="12" y="30" width="2" height="5" rx="1"/>
    <rect x="12" y="39" width="2" height="4" rx="1"/>
    <rect x="50" y="39" width="2" height="4" rx="1"/>
  </g>
  <!-- Gatehouse arch with the portcullis torn half away. -->
  <g>
    <path d="M26.5 48 L26.5 39.5 Q32 33.5 37.5 39.5 L37.5 48 Z" fill="#6f6a60"/>
    <path d="M27.8 48 L27.8 40.2 Q32 35.4 36.2 40.2 L36.2 48 Z" fill="#2c2820"/>
    <path d="M30 38.56 V43 M32 37.82 V44.6 M34 38.56 V42 M28 41.5 H35" stroke="#55514a" stroke-width="0.7"/>
  </g>
  <!-- Rubble from the breach and the fallen tower tops. Each loose block
       sits on its own contact shadow. -->
  <g>
    <ellipse cx="20" cy="51.4" rx="6" ry="1.4" fill="#42522f" opacity="0.5"/>
    <use href="#stone" transform="translate(17 50.2)"/>
    <use href="#stone" transform="translate(20.4 50.8) scale(1.2)"/>
    <use href="#stone" transform="translate(23.4 50.2) scale(0.8)"/>
    <use href="#stone" transform="translate(19 48.6) scale(0.9)"/>
    <ellipse cx="53" cy="53" rx="4.4" ry="1.1" fill="#42522f" opacity="0.5"/>
    <use href="#stone" transform="translate(51.4 52) scale(1.1)"/>
    <use href="#stone" transform="translate(54.6 52.2) scale(0.9)"/>
    <use href="#stone" transform="translate(9 53) scale(0.8)"/>
    <ellipse cx="9" cy="54" rx="1.6" ry="0.5" fill="#42522f" opacity="0.5"/>
  </g>
  <!-- Moss on the broken wall tops. -->
  <ellipse cx="22.5" cy="36.8" rx="1.4" ry="0.6" fill="#6a9440" opacity="0.85"/>
  <ellipse cx="48" cy="34.2" rx="1.3" ry="0.6" fill="#6a9440" opacity="0.85"/>
  <path d="M29 52 Q32 51 35 52 M27 55 Q32 53.8 37 55" stroke="#7a6a4a" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
