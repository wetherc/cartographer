<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Spruce: four tiers lit on the west half, snow along each bough edge. -->
    <g id="sp">
      <ellipse cx="1.5" cy="0.8" rx="6" ry="1.8" fill="#26402f" opacity="0.6"/>
      <rect x="-0.9" y="-2.5" width="1.8" height="3.3" fill="#4a3626"/>
      <polygon points="-6,-1.5 0,-9.5 6,-1.5" fill="#1f3d2e"/>
      <polygon points="-6,-1.5 0,-9.5 0,-1.5" fill="#2d5241"/>
      <polygon points="-4.8,-6.5 0,-13.5 4.8,-6.5" fill="#1f3d2e"/>
      <polygon points="-4.8,-6.5 0,-13.5 0,-6.5" fill="#2d5241"/>
      <polygon points="-3.6,-10.5 0,-17 3.6,-10.5" fill="#1f3d2e"/>
      <polygon points="-3.6,-10.5 0,-17 0,-10.5" fill="#2d5241"/>
      <g fill="#eef3f6">
        <path d="M-6.4 -1.3 Q0 -4.4 6.4 -1.3 Q0 -2.6 -6.4 -1.3 Z"/>
        <path d="M-5.2 -6.3 Q0 -9 5.2 -6.3 Q0 -7.5 -5.2 -6.3 Z"/>
        <path d="M-4 -10.3 Q0 -12.8 4 -10.3 Q0 -11.4 -4 -10.3 Z"/>
        <polygon points="0,-17 1.7,-14 0,-14.8 -1.7,-14"/>
      </g>
    </g>
    <g id="dr">
      <path d="M-7 0.5 Q0 1.8 7 0.5 Q0 2.9 -7 0.5 Z" fill="#b3c0ca"/>
      <path d="M-7 0.5 Q-6 -2.2 -2 -2.4 Q1 -3.4 4 -2 Q7.2 -1.4 7 0.5 Q0 1.8 -7 0.5 Z" fill="#e3e9ed"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#3d5e4c"/>
  <!-- Trees stay inside the tile: trunks at least 6 units from the side
       edges and bases low enough that the tips clear the top edge. No stamp
       repeats at the same spot on every variant, so a field of taiga shows
       no rows at the 64-pixel tile pitch. Farthest (highest base) first. -->
  <g fill="#375645">
    <ellipse cx="30" cy="18" rx="10" ry="6"/>
    <ellipse cx="20" cy="52" rx="11" ry="6"/>
  </g>
  <use href="#sp" transform="translate(8 16) scale(0.6)"/>
  <use href="#sp" transform="translate(36 15) scale(0.65)"/>
  <use href="#sp" transform="translate(50 22)"/>
  <use href="#sp" transform="translate(18 24) scale(0.9)"/>
  <use href="#sp" transform="translate(8 33) scale(0.8)"/>
  <use href="#dr" transform="translate(31 29)"/>
  <use href="#sp" transform="translate(55 42) scale(0.9)"/>
  <use href="#sp" transform="translate(14 48) scale(0.95)"/>
  <use href="#sp" transform="translate(40 55) scale(0.95)"/>
  <use href="#sp" transform="translate(25 57) scale(0.8)"/>
  <use href="#sp" transform="translate(52 58) scale(0.85)"/>
  <use href="#sp" transform="translate(8 62) scale(0.7)"/>
</svg>
