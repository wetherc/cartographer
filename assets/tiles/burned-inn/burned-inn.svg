<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="13" cy="11" rx="8" ry="4.5" fill="#63a651"/>
  <ellipse cx="53" cy="55" rx="7" ry="4" fill="#529044"/>
  <!-- Scorched yard: browned grass around a sooty dirt patch. -->
  <ellipse cx="32" cy="44" rx="23" ry="12" fill="#7a8a45"/>
  <ellipse cx="32" cy="44" rx="20" ry="10" fill="#8a7a5a"/>
  <ellipse cx="32" cy="45" rx="14" ry="7" fill="#6a6050"/>
  <!-- Smoke from the rubble inside. -->
  <g fill="#b8b3a8">
    <circle cx="30" cy="16" r="2" opacity="0.5"/>
    <circle cx="32.5" cy="12" r="2.6" opacity="0.35"/>
    <circle cx="35.5" cy="8.5" r="3" opacity="0.2"/>
  </g>
  <!-- Two-story shell: the plaster is soot-streaked, the upper floor is
       burned down to a ragged line, and the timbers are charred black. -->
  <path d="M16 48 V27 L18.5 25.5 L21 28 L24 24.5 L27 27.5 L31 26 L34 28.5 L37 25 L40 27.5 L42 25 H46 V48 Z" fill="#a8977a" stroke="#6a5d4a" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M21 28 L24 24.5 L27 27.5 V36 H21 Z M34 28.5 L37 25 L40 27.5 V36 H34 Z" fill="#8a7b62"/>
  <path d="M16 36 H46 M22 26.8 V36 M40 27 V36 M19 36 V48 M43 36 V48" stroke="#2e2824" stroke-width="1.2"/>
  <path d="M22 30.5 L25.5 27.3 M40 30.5 L37 27.7" stroke="#2e2824" stroke-width="1"/>
  <path d="M26 36 Q27 40 26.5 44 M36.5 36 Q35.5 39 36 42" stroke="#6a5d4a" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Stone chimney still whole, and bare rafters over the empty roof. -->
  <rect x="42" y="16" width="3.5" height="9" fill="#8a8f94" stroke="#6f747a" stroke-width="0.5"/>
  <path d="M42 16 H45.5 V18.5 Q43.75 17.5 42 19 Z" fill="#3d342c"/>
  <g stroke="#2e2824" stroke-linecap="round">
    <path d="M17 25.8 L26.5 19.4" stroke-width="1.2"/>
    <path d="M29 26 L25.4 21.6" stroke-width="1"/>
    <path d="M35 26.5 L36.6 22.6 L40 24.8" stroke-width="1" fill="none"/>
  </g>
  <!-- Empty window holes, upper floor, with glass gone and frames burned. -->
  <g fill="#2e2824" stroke="#4a3a2c" stroke-width="0.7">
    <rect x="29" y="29" width="5" height="4.5"/>
    <rect x="38" y="29" width="4" height="4.5"/>
  </g>
  <path d="M31.5 29 V33.5" stroke="#4a3a2c" stroke-width="0.55"/>
  <!-- Ground floor: the door is gone, and the windows are dark holes. -->
  <rect x="28" y="40" width="6.5" height="8" fill="#2e2824"/>
  <path d="M28 40 Q31.25 38.4 34.5 40" fill="#2e2824"/>
  <path d="M29.5 48 L31.8 44.6 L33.6 48 Z" fill="#9a958c"/>
  <g fill="#2e2824" stroke="#4a3a2c" stroke-width="0.7">
    <rect x="20" y="40" width="5" height="4.5"/>
    <rect x="37.5" y="40" width="5" height="4.5"/>
  </g>
  <circle cx="22" cy="43.4" r="0.45" fill="#e8a040"/>
  <!-- The sign post, burned through and fallen on the ground. The sign
       lies flat with the crescent still showing. -->
  <g>
    <rect x="10.2" y="41" width="1.6" height="7" fill="#3d342c"/>
    <path d="M10.2 41 L11 40.1 L11.8 41 Z" fill="#2e2824"/>
    <ellipse cx="14" cy="51.4" rx="5.2" ry="1" fill="#2e2824" opacity="0.4"/>
    <path d="M9.5 50.6 L18.5 49.4" stroke="#3d342c" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="11.6" y="50.2" width="6" height="3.2" rx="0.8" fill="#3f4d5e" stroke="#2e3a48" stroke-width="0.6"/>
    <path d="M16 50.8 a1.3 1.2 0 1 0 0 2 a1.6 1.4 0 0 1 0 -2 Z" fill="#b8a86a"/>
  </g>
  <!-- Ash and fallen roof slates in front of the door. -->
  <g>
    <ellipse cx="41" cy="51" rx="3.6" ry="1.4" fill="#9a958c"/>
    <ellipse cx="40.4" cy="50.6" rx="1.8" ry="0.7" fill="#b8b3a8"/>
    <path d="M22 51 L25 50.2 L25.6 51.4 L22.6 52 Z M45.5 47 L48 46.4 L48.4 47.6 L46 48 Z" fill="#4a5d74"/>
    <path d="M36 53.4 L38.6 52.6 L39 53.8 L36.6 54.4 Z" fill="#37485c"/>
  </g>
  <path d="M27 54.5 Q32 53.4 37 54.5" stroke="#5a5340" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
