<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A timber quay on a shore with the water to the north, over a
       transparent ground. It goes on top of coast-n, and its wharf deck
       covers the waterline in the middle of the tile. The street comes in
       at the south edge and matches road-v there, and the pier goes out at
       the north edge and matches dock-pier-v there. A soft contact shadow
       lies around the footprint of the wharf and the pier. -->
  <g fill="#1f3b4d">
    <rect x="20.5" width="23" height="22" opacity="0.2"/>
    <rect x="21.8" width="20.4" height="22" opacity="0.25"/>
    <rect x="7.5" y="17.5" width="49" height="23.5" rx="2.5" opacity="0.2"/>
    <rect x="8.8" y="18.8" width="46.4" height="21" rx="1.5" opacity="0.25"/>
  </g>
  <!-- The street, the same as road-v, up to the back of the wharf. -->
  <path d="M32 64 L32 38" stroke="#7c6448" stroke-width="20" fill="none"/>
  <path d="M32 64 L32 38" stroke="#bb9c70" stroke-width="16" fill="none"/>
  <g stroke="#9c8158" stroke-width="1.5" fill="none"><path d="M27 64 L27 38"/><path d="M37 64 L37 38"/></g>
  <circle cx="35" cy="54" r="0.9" fill="#cbb083"/>
  <!-- Ripples where the water meets the piles. -->
  <g fill="none" stroke="#8ac2e6" stroke-width="0.8" opacity="0.7">
    <path d="M20.6 10.5 Q18.8 12 20.6 13.5 M43.4 10.5 Q45.2 12 43.4 13.5"/>
    <path d="M8 18.4 Q6.2 20 8 21.6 M56 18.4 Q57.8 20 56 21.6"/>
  </g>
  <!-- Pile heads: two on the pier, as on dock-pier-v, and one at each
       seaward corner of the wharf. -->
  <g fill="#4a3a26">
    <rect x="21" y="10.4" width="3.4" height="3.2" rx="0.8"/>
    <rect x="39.6" y="10.4" width="3.4" height="3.2" rx="0.8"/>
    <rect x="8.4" y="18.4" width="3.6" height="3.4" rx="0.8"/>
    <rect x="52" y="18.4" width="3.6" height="3.4" rx="0.8"/>
  </g>
  <!-- The pier deck, on the same plank pitch as dock-pier-v. -->
  <rect x="24" width="16" height="22" fill="#8a6f4a"/>
  <rect x="24" y="14.4" width="16" height="3.2" fill="#93774f"/>
  <path d="M24 2 H40 M24 6 H40 M24 10 H40 M24 14 H40 M24 18 H40" stroke="#6f583a" stroke-width="0.7"/>
  <path d="M26.2 0 V20 M37.8 0 V20" stroke="#4a3a26" stroke-width="0.8" stroke-dasharray="0.8 3.2" stroke-dashoffset="0.4"/>
  <rect x="22.8" width="1.8" height="21" fill="#5f4529"/>
  <rect x="39.4" width="1.8" height="21" fill="#5f4529"/>
  <!-- The wharf: a wide planked deck in a stringer frame across the
       waterline. -->
  <rect x="11" y="21" width="42" height="17" fill="#8a6f4a"/>
  <rect x="11" y="25.4" width="42" height="3.2" fill="#7f6644"/>
  <rect x="11" y="33.4" width="42" height="3.2" fill="#93774f"/>
  <path d="M11 25 H53 M11 29 H53 M11 33 H53" stroke="#6f583a" stroke-width="0.7"/>
  <path d="M13.2 23 V37 M50.8 23 V37" stroke="#4a3a26" stroke-width="0.8" stroke-dasharray="0.8 3.2" stroke-dashoffset="0.4"/>
  <rect x="10" y="20" width="44" height="19" fill="none" stroke="#5f4529" stroke-width="1.8"/>
  <!-- Bollards on the seaward edge, seen from above. -->
  <g>
    <circle cx="14.5" cy="23.4" r="2" fill="#3a2e1f"/>
    <circle cx="14.5" cy="23.4" r="1.1" fill="#6f583a"/>
    <circle cx="49.5" cy="23.4" r="2" fill="#3a2e1f"/>
    <circle cx="49.5" cy="23.4" r="1.1" fill="#6f583a"/>
  </g>
  <!-- Cargo on the wharf: two crates and a barrel, seen from above. -->
  <g>
    <rect x="14.5" y="29" width="6" height="6" fill="#a3865c" stroke="#7a6543" stroke-width="0.7"/>
    <path d="M14.5 29 L20.5 35 M20.5 29 L14.5 35" stroke="#7a6543" stroke-width="0.6"/>
    <rect x="21.2" y="31" width="4.4" height="4.4" fill="#93714a" stroke="#6f583a" stroke-width="0.7"/>
    <circle cx="46" cy="32.4" r="3" fill="#84572e" stroke="#4a2f17" stroke-width="0.8"/>
    <circle cx="46" cy="32.4" r="2" fill="none" stroke="#3a3530" stroke-width="0.7"/>
    <circle cx="46" cy="32.4" r="0.6" fill="#2e1a08"/>
  </g>
  <!-- A coil of rope by the pier. -->
  <g fill="none" stroke="#b09a72">
    <circle cx="36" cy="24.8" r="2.2" stroke-width="1.1"/>
    <circle cx="36" cy="24.8" r="0.9" stroke-width="0.8"/>
  </g>
</svg>
