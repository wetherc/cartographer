<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#5a9b4a"/>
  <ellipse cx="11" cy="12" rx="8" ry="4.5" fill="#63a651"/>
  <ellipse cx="54" cy="8" rx="6" ry="3.5" fill="#529044"/>
  <!-- Grassy knoll, burned brown around the foot of the tower. -->
  <ellipse cx="32" cy="52" rx="24" ry="8" fill="#4f8d40"/>
  <ellipse cx="31" cy="50.5" rx="21" ry="6.5" fill="#7a8a45"/>
  <ellipse cx="32" cy="52" rx="14" ry="4" fill="#6a6443"/>
  <ellipse cx="32" cy="52" rx="9" ry="2.6" fill="#5a5340"/>
  <!-- Back legs, charred, one burned off below the platform. -->
  <g stroke="#2e2824" stroke-width="1.8" stroke-linecap="round">
    <path d="M26 50 L28 24"/>
    <path d="M38 50 L37.2 40"/>
  </g>
  <path d="M37.2 40 L36.4 38.6 L37.8 39" stroke="#e8a040" stroke-width="0.6" fill="none"/>
  <!-- One cross brace still pinned between the front legs. -->
  <path d="M22.2 44 L41.8 33 M22.2 44 H41.8" stroke="#3d342c" stroke-width="1" fill="none"/>
  <!-- Front legs, blackened. The east leg is snapped at half height. -->
  <g stroke-linecap="round">
    <path d="M21 53 L25 24" stroke="#3d342c" stroke-width="2.4"/>
    <path d="M21.6 52 L25.2 26" stroke="#4a3a2c" stroke-width="0.6"/>
    <path d="M43 53 L41.2 38" stroke="#2e2824" stroke-width="2.4"/>
  </g>
  <path d="M40.2 38.6 L41 36.4 L41.8 38 L42.4 37 L42.3 38.8 Z" fill="#2e2824"/>
  <!-- Ladder with most rungs burned away. -->
  <g stroke="#4a3a2c" stroke-width="0.8">
    <path d="M30 52 L30.3 34 M34 52 L33.8 40"/>
    <path d="M30 48 H34 M30.1 44 H33.9"/>
  </g>
  <!-- Platform, tipped down to the east where the leg gave way, with the
       roof and rail gone. -->
  <path d="M21 21 L43 29 L42.2 31.6 L20.6 24.4 Z" fill="#3d342c" stroke="#2e2824" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M25 22.5 L24.7 25.7 M30 24.3 L29.6 27.4 M35 26.1 L34.6 29.2 M39 27.6 L38.6 30.6" stroke="#2e2824" stroke-width="0.4"/>
  <path d="M22.4 21.5 L23 14.5 M31.6 24.8 L32.4 18.6" stroke="#2e2824" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M23 14.5 L22.2 13.4 L23.8 14 Z" fill="#2e2824"/>
  <!-- Fallen planks and roof shingles at the foot, with an overturned
       brazier. Long pieces lie on a footprint pad. -->
  <g>
    <path d="M44 55.4 L55 53.2 L55.4 54.6 L44.4 56.8 Z" fill="#2e2824" opacity="0.35"/>
    <path d="M44 54 L55 51.8 L55.3 53 L44.3 55.2 Z" fill="#4a3a2c"/>
    <path d="M9.5 55.2 L19 56.4 L18.9 57.6 L9.4 56.4 Z" fill="#2e2824" opacity="0.35"/>
    <path d="M9.5 54 L19 55.2 L18.9 56.3 L9.4 55.1 Z" fill="#3d342c"/>
    <path d="M13 50 L16 49.2 L16.6 50.4 L13.6 51 Z M47 48.6 L49.6 48 L50 49.2 L47.4 49.6 Z" fill="#5f4529"/>
    <ellipse cx="36.5" cy="56.2" rx="2.4" ry="0.8" fill="#2e2824" opacity="0.4"/>
    <path d="M34.6 55.6 L37.2 54 L38.6 55.2 L36 56.6 Z" fill="#3a362f"/>
    <circle cx="39.2" cy="56" r="0.5" fill="#e8a040"/>
    <ellipse cx="28" cy="53.4" rx="3" ry="1" fill="#9a958c"/>
    <ellipse cx="27.6" cy="53.1" rx="1.5" ry="0.5" fill="#b8b3a8"/>
  </g>
  <!-- A thin trail of smoke from the broken leg. -->
  <g fill="#b8b3a8">
    <circle cx="38" cy="35" r="1.4" opacity="0.5"/>
    <circle cx="39.6" cy="31.8" r="1.8" opacity="0.35"/>
    <circle cx="41.8" cy="28.8" r="2.1" opacity="0.2"/>
  </g>
</svg>
