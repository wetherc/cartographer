<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Acacia: forked trunk under a flat, layered canopy. -->
    <g id="ac">
      <ellipse cx="3" cy="0.8" rx="10" ry="2.4" fill="#8f8340" opacity="0.7"/>
      <path d="M0 1 L0 -4.5 L-3.5 -9 M0 -4.5 L3.5 -9.5 M-1.6 -6.6 L-5.5 -8.4" stroke="#5a4630" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-10.2" rx="11" ry="3.2" fill="#56662a"/>
      <ellipse cx="-1" cy="-11" rx="9" ry="2.4" fill="#6f8236"/>
      <ellipse cx="-3" cy="-11.6" rx="4.5" ry="1.1" fill="#8ea24a"/>
    </g>
    <g id="gt" fill="none" stroke-linecap="round">
      <path d="M0 0 Q-2 -4 -3.5 -8" stroke="#8f8038" stroke-width="1.2"/>
      <path d="M0 0 Q0 -5 -0.3 -10" stroke="#8f8038" stroke-width="1.2"/>
      <path d="M0 0 Q2 -4 3.5 -7.5" stroke="#8f8038" stroke-width="1.2"/>
      <path d="M0.5 0 Q1.4 -4.2 2.4 -7" stroke="#e2d58a" stroke-width="0.9"/>
      <path d="M-0.4 0 Q-1.2 -4 -2.2 -6.6" stroke="#e2d58a" stroke-width="0.9"/>
    </g>
    <g id="bu">
      <ellipse cx="1" cy="1" rx="4" ry="1.2" fill="#8f8340" opacity="0.7"/>
      <circle cx="-1.5" cy="-1.5" r="2.6" fill="#6b7a32"/>
      <circle cx="1.8" cy="-1.2" r="2.4" fill="#6b7a32"/>
      <circle cx="-0.8" cy="-2.4" r="1.4" fill="#86984a"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#b5a654"/>
  <g fill="#aa9a4a">
    <ellipse cx="16" cy="16" rx="11" ry="6"/>
    <ellipse cx="46" cy="46" rx="12" ry="7"/>
  </g>
  <g fill="#c3b464">
    <ellipse cx="46" cy="14" rx="9" ry="5"/>
    <ellipse cx="16" cy="46" rx="9" ry="5"/>
  </g>
  <!-- Edge band: identical across savanna variants, stamped in wrapped pairs
       (a stamp that crosses x=0 repeats at +64, likewise y) so grass tufts
       continue across tile seams. -->
  <g>
    <use href="#gt" transform="translate(1 30) scale(0.9)"/>
    <use href="#gt" transform="translate(65 30) scale(0.9)"/>
    <use href="#gt" transform="translate(28 3) scale(-0.85 0.85)"/>
    <use href="#gt" transform="translate(28 67) scale(-0.85 0.85)"/>
    <use href="#gt" transform="translate(-1 58) scale(0.8)"/>
    <use href="#gt" transform="translate(63 58) scale(0.8)"/>
    <use href="#gt" transform="translate(52 2) scale(0.9)"/>
    <use href="#gt" transform="translate(52 66) scale(0.9)"/>
  </g>
  <!-- Inset grass, shrubs, and trees, farthest (highest base) first. -->
  <use href="#gt" transform="translate(12 22)"/>
  <use href="#ac" transform="translate(38 30) scale(1.1)"/>
  <use href="#gt" transform="translate(54 36) scale(0.9)"/>
  <use href="#bu" transform="translate(18 44)"/>
  <use href="#gt" transform="translate(30 50)"/>
  <use href="#gt" transform="translate(44 56) scale(0.85)"/>
  <use href="#gt" transform="translate(10 56) scale(0.8)"/>
</svg>
