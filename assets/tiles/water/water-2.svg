<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One wave crest: a dark trough line under a pale crest line. Crests
         stay inset from the edges, so water tiles abut in any order and
         open water shows no continuous stripes at the tile pitch. -->
    <g id="wc" fill="none" stroke-linecap="round">
      <path d="M-7 1.6 Q-3.5 -1.8 0 1.6 T7 1.6" stroke="#2a5d87" stroke-width="2.2"/>
      <path d="M-7 0 Q-3.5 -3.4 0 0 T7 0" stroke="#8ac2e6" stroke-width="1.8"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#33719f"/>
  <ellipse cx="42" cy="22" rx="14" ry="8" fill="#2d6591"/>
  <g fill="none" stroke="#a8d4f0">
    <circle cx="20" cy="44" r="2.5" stroke-width="1.4"/>
    <circle cx="20" cy="44" r="5.5" stroke-width="1" opacity="0.6"/>
    <circle cx="20" cy="44" r="8.5" stroke-width="0.8" opacity="0.3"/>
  </g>
  <use href="#wc" transform="translate(12 12) scale(0.85)"/>
  <use href="#wc" transform="translate(44 12) scale(0.75)"/>
  <use href="#wc" transform="translate(50 32)"/>
  <use href="#wc" transform="translate(46 52) scale(0.8)"/>
  <use href="#wc" transform="translate(14 58) scale(0.7)"/>
  <g fill="#8ac2e6">
    <circle cx="30" cy="26" r="1"/>
    <circle cx="8" cy="28" r="0.9"/>
    <circle cx="34" cy="56" r="0.9"/>
  </g>
</svg>
