<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One wave crest: a dark trough line under a pale crest line. Crests
         stay inset from the edges, so water tiles abut in any order and
         open water shows no continuous stripes at the tile pitch. -->
    <g id="wc" fill="none" stroke-linecap="round">
      <path d="M-7 1.6 Q-3.5 -1.8 0 1.6 T7 1.6" stroke="#2a5d87" stroke-width="2.2"/>
      <path d="M-7 0 Q-3.5 -3.4 0 0 T7 0" stroke="#8ac2e6" stroke-width="1.8"/>
    </g>
  </defs>
  <rect width="64" height="64" fill="#33719f"/>
  <ellipse cx="16" cy="46" rx="12" ry="7" fill="#2d6591"/>
  <ellipse cx="46" cy="12" rx="10" ry="5" fill="#2d6591"/>
  <use href="#wc" transform="translate(16 20)"/>
  <use href="#wc" transform="translate(40 30) scale(0.8)"/>
  <use href="#wc" transform="translate(54 48) scale(0.9)"/>
  <use href="#wc" transform="translate(28 54) scale(0.7)"/>
  <use href="#wc" transform="translate(10 36) scale(0.7)"/>
  <g fill="#8ac2e6">
    <circle cx="56" cy="22" r="1"/>
    <circle cx="30" cy="42" r="0.9"/>
    <circle cx="8" cy="8" r="0.9"/>
  </g>
</svg>
